<!doctype html><meta charset="utf-8"><title>Varin director · internal authored review</title>
<style>body{margin:0;background:#303844;color:#edf0f5;font:14px system-ui}#controls{position:relative;z-index:10;padding:12px;background:#202631}button,select{padding:7px;margin:3px}canvas{position:absolute;left:calc(50% - 170px);top:210px;width:340px;height:340px}#status{position:fixed;bottom:5px;left:12px;max-width:94vw}#legend{display:flex;gap:8px}.note{color:#edc78b}</style>
<div id="controls"><strong>主管候选联合审阅 · 显式场景数据，不连接 Host</strong><p class="note">同一个实际播放器与场景源码；人物未做最终选择。本页先审管理语句与项目联动；完整抓放另做接触路径验收，不将结构覆盖当作画面通过。</p><div id="legend"></div>
<button data-case="overview">监督组合</button><button data-case="intake">B 新项目接收→交负责人</button><button data-case="result">B 结果 / A 仍执行</button><button data-case="attention">B 授权与 C 问题并存</button><button id="next-request">场景：B请求已解除 / C问题仍待答</button><button data-case="unknown">观察未知</button><button data-case="clear">清静</button><button id="local-attention">本地轻关注短句（不是项目事件）</button><button id="detail">A 工具变化（不切 Varin 身体）</button><button id="child">A 子队结束 / 中性退场</button><button id="side">真实左右姿态换边</button><label><input id="hide-names" type="checkbox">隐藏浮层任务名</label><label><input id="reduced" type="checkbox">减少动态</label></div>
<canvas id="actor" width="512" height="512"></canvas><div id="scene"></div><p id="status">载入候选…</p>
<script type="module">
import{CompanionPlayback,frameAt,mountCompanionScene,sceneCue}from'./runtime.js';
const canvas=document.querySelector('#actor'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),surface=mountCompanionScene(document.querySelector('#scene'));
const raw=await(await fetch('./candidate/bundle.json')).json(),assets=raw.packages,p=new CompanionPlayback(assets,{allowCandidates:true}),byId=new Map(assets.map(a=>[a.id,a]));
const images=new Map(),jobs=new Map();let wanted=new Set(),frameKey='',last=performance.now(),revision=0,cue='transition',cueInstance=0,message='',side='right',detailIndex=0,mode='overview',inspected='a',subject=null,requested='director-supervise', presentationContext='';
const projects=[{key:'a',label:'A',lead:{avatar:'slope-lilac',role:'project-lead'},status:'active',requestCount:0,uncertainCount:0,detail:'reading'},{key:'b',label:'B',lead:{avatar:'dome-ivory',role:'project-lead'},status:'active',requestCount:0,uncertainCount:0,detail:'searching'},{key:'c',label:'C',lead:{avatar:'taper-sage',role:'project-lead'},status:'settling',requestCount:0,uncertainCount:0}];
const titles={a:'论文材料项目',b:'实验复现项目',c:'结果整理项目'};let children=true,otherChildren=true;
function legend(){document.querySelector('#legend').replaceChildren(...projects.map(a=>{const b=document.createElement('button');b.textContent=`${a.label} · ${titles[a.key]} · ${a.status}`;b.onclick=()=>{inspected=a.key;subject=null;mode='inspection';request('director-listen-'+side)};return b}))}legend();
function portfolio(){return{mode,projects:projects.map(p=>({...p,...(document.querySelector('#hide-names').checked?{}:{caption:titles[p.key]})})),inspectedKey:inspected,subjectKey:subject,overflowCards:0,...(projects.every(p=>p.status!=='unknown')?{teams:[{projectKey:'a',members:children?[{key:'child-a-1',avatar:'pebble-blue',state:'running'}]:[],overflowCount:0},{projectKey:'c',members:otherChildren?[{key:'child-c-1',avatar:'slope-lilac',state:'waiting'}]:[],overflowCount:0}]}:{})}}
function publish(){const r=canvas.getBoundingClientRect(),descriptor={scope:'director-explicit-review-fixture',revision:revision+1,kind:'portfolio',portfolio:portfolio(),phase:'active',outcome:null,count:null,cue:p.currentContext===presentationContext?cue:'transition',cueInstance,suppressed:false,reducedMotion:document.querySelector('#reduced').checked,menuOpen:false};const layout={character:{x:r.x/innerWidth,y:r.y/innerHeight,width:r.width/innerWidth,height:r.height/innerHeight},visible:{x:0,y:0,width:1,height:1},inspectionSide:side},key=JSON.stringify([descriptor.portfolio,cue,cueInstance,descriptor.reducedMotion,layout]);if(key===message)return;message=key;descriptor.revision=++revision;surface.update({descriptor,layout})}
function request(action){requested=action;const asset=assets.find(a=>a.action===action);if(!asset){status.textContent='缺候选动作：'+action;return}presentationContext=JSON.stringify([mode,subject,inspected,side]);p.request(asset.id,{context:presentationContext});publish()}
function prepare(){const ids=[p.current?.id,p.loading,p.pending,p.path[0]].filter(Boolean);wanted=new Set(ids.flatMap(id=>byId.get(id)?.pages.map(page=>page.file)??[]));for(const[file,bitmap]of images)if(!wanted.has(file)){bitmap.close();images.delete(file)}for(const[file]of jobs)if(!wanted.has(file))jobs.delete(file);for(const file of wanted)if(!images.has(file)&&!jobs.has(file)){const token={};jobs.set(file,token);fetch('./candidate/'+file).then(r=>{if(!r.ok)throw Error('missing '+file);return r.blob()}).then(blob=>createImageBitmap(blob)).then(bitmap=>{if(jobs.get(file)!==token||!wanted.has(file)){bitmap.close();return}images.set(file,bitmap);jobs.delete(file)}).catch(e=>{if(jobs.get(file)===token){jobs.delete(file);status.textContent=String(e)}})}}
p.canDisplay=id=>byId.get(id)?.pages.every(page=>images.has(page.file))??false;
function tick(now){prepare();if(p.loading&&p.canDisplay(p.loading))p.advance();if(!document.hidden&&(!document.querySelector('#reduced').checked||!p.canPauseRepeatedMotion()))p.tick(Math.max(0,now-last));last=now;const a=p.current,f=a&&frameAt(a,p.timeMs);if(a&&f&&p.canDisplay(a.id)){const key=a.id+':'+f.startMs+':'+p.currentContext;if(key!==frameKey){frameKey=key;ctx.clearRect(0,0,512,512);ctx.drawImage(images.get(a.pages[f.page].file),...f.rect,...f.offset,f.rect[2],f.rect[3]);const next=sceneCue(f.cue,a.sceneAction??a.action);if(next!==cue){cue=next;cueInstance++}}status.textContent=`候选 · ${a.id} · ${f.cue??'REST'} · ${p.blocker??'真实原画 / 项目事实与管理身体分离'}`;if(p.currentContext===presentationContext&&!p.pending&&!p.loading&&!a.loop&&p.timeMs>=a.durationMs&&a.action?.startsWith('director-')&&a.action!=='director-supervise'&&requested===a.action)request('director-supervise')}publish();requestAnimationFrame(tick)}
for(const b of document.querySelectorAll('[data-case]'))b.onclick=()=>{mode=b.dataset.case;otherChildren=true;projects.forEach(a=>{a.requestCount=0;a.uncertainCount=0;delete a.notice;a.status='active'});subject=null;if(mode==='clear'){mode='overview';inspected=null;children=false;otherChildren=false;projects.forEach(a=>{a.status='available';delete a.detail});request('idle-closed')}else if(mode==='unknown'){mode='overview';children=false;otherChildren=false;projects.forEach(a=>{a.status='unknown';a.requestCount=null;a.uncertainCount=null;delete a.detail});request('director-supervise')}else if(mode==='intake'){subject='b';request('director-intake')}else if(mode==='result'){subject='b';projects[1].status='result';delete projects[1].detail;request('director-gather-present')}else if(mode==='attention'){subject='b';projects[1].status=projects[2].status='needs-user';projects[1].requestCount=projects[2].requestCount=1;projects[1].notice='permission';projects[2].notice='question';request('director-gather-present')}else request('director-supervise');legend();publish()};
document.querySelector('#next-request').onclick=()=>{mode='attention';subject='c';projects[1].status='active';projects[1].requestCount=0;delete projects[1].notice;projects[2].status='needs-user';projects[2].requestCount=1;projects[2].notice='question';request('director-gather-present');legend();publish()};
document.querySelector('#local-attention').onclick=()=>request('director-open-attention');
document.querySelector('#detail').onclick=()=>{projects[0].detail=['reading','searching','editing'][++detailIndex%3];publish()};document.querySelector('#child').onclick=()=>{children=!children;publish()};document.querySelector('#side').onclick=()=>{side=side==='right'?'left':'right';request('director-listen-'+side)};document.querySelector('#reduced').onchange=publish;document.querySelector('#hide-names').onchange=publish;function layoutReview(){canvas.style.top=(document.querySelector('#controls').getBoundingClientRect().bottom+48)+'px';publish()}new ResizeObserver(layoutReview).observe(document.querySelector('#controls'));window.onresize=layoutReview;layoutReview();document.addEventListener('visibilitychange',()=>last=performance.now());request('director-supervise');requestAnimationFrame(tick);
</script>
