<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="name"></title><link rel="stylesheet" href="popup.css"></head>
<body><header><h1 data-i18n="name"></h1><p id="connection-name" data-i18n="connect"></p></header>
<section id="setup"><form id="pair-form"><label for="pair-link" data-i18n="pairLink"></label><textarea id="pair-link" rows="3" placeholder="varin://connect?…" autocomplete="off" spellcheck="false"></textarea>
<label for="host-address" data-i18n="serviceAddress"></label><select id="host-address"></select><button type="submit" data-i18n="connect"></button></form>
<p class="hint" data-i18n="setupHint"></p></section>
<section id="connected" hidden><p class="hint" data-i18n="shareHint"></p>
<div class="actions"><button id="share" data-i18n="share"></button><button id="disconnect" class="quiet" data-i18n="stopAll"></button></div>
<ul id="pages"></ul><button id="forget" class="quiet" data-i18n="disconnect"></button></section>
<p id="status" role="status"></p>
<footer class="hint" data-i18n="controlHint"></footer>
<script type="module" src="popup.mjs"></script></body></html>
