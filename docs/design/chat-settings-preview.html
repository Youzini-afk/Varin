.thinking-block {
  --thinking-ease: cubic-bezier(.4, 0, .2, 1);
  min-width: 0;
  margin-block: .25rem;
  color: var(--muted-foreground);
}

.thinking-heading {
  display: flex;
  align-items: center;
  gap: .4rem;
  width: 100%;
  min-width: 0;
  padding: .375rem .5rem .375rem 0;
  border-radius: .5rem;
  text-align: left;
  cursor: pointer;
  transition: background-color 160ms ease;
}
.thinking-heading:hover:not(:disabled) { background: color-mix(in oklab, var(--muted) 25%, transparent); }
.thinking-heading:focus-visible, .thinking-scroll:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}
.thinking-heading:disabled { cursor: default; }
.thinking-label { flex-shrink: 0; font-weight: 500; color: color-mix(in oklab, var(--foreground) 80%, transparent); }
.thinking-chevron { transition: transform 300ms var(--thinking-ease); }
.thinking-block[data-open="true"] .thinking-chevron { transform: rotate(90deg); }

.thinking-preview {
  display: block;
  flex: 1;
  min-width: 0;
  height: 1.75em;
  line-height: 1.75;
  overflow: hidden;
  overflow-anchor: none;
  pointer-events: none;
  opacity: .75;
  mask-image: linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);
  transition: opacity 200ms ease;
}
.thinking-preview-text { display: block; overflow-wrap: anywhere; }
.thinking-block[data-open="true"] .thinking-preview { opacity: 0; }

/* Keep the body mounted during collapse; native details hides it before a closing animation. */
.thinking-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows 320ms var(--thinking-ease), opacity 220ms ease;
}
.thinking-block[data-open="true"] .thinking-panel { grid-template-rows: 1fr; opacity: 1; }
.thinking-panel-clip { min-height: 0; overflow: hidden; }
.thinking-window {
  position: relative;
  margin: .125rem 0 .5rem .375rem;
  border-left: 1px solid color-mix(in oklab, var(--border) 65%, transparent);
}
.thinking-scroll {
  /* Roughly half a desktop viewport: enough space for sustained reading, with no text truncation. */
  max-height: min(34rem, max(20rem, 52dvh));
  overflow: auto;
  overscroll-behavior: contain;
  overflow-anchor: none;
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--muted-foreground) 25%, transparent) transparent;
  border-radius: .25rem;
}
.thinking-body { padding: .375rem .75rem .625rem .875rem; }
.thinking-body .markdown-content { min-width: 0; overflow-wrap: anywhere; }
.thinking-body .markdown-content > :first-child { margin-top: 0; }
.thinking-body .markdown-content > :last-child { margin-bottom: 0; }
.thinking-follow {
  position: absolute;
  bottom: .625rem;
  right: 1.25rem;
  display: flex;
  align-items: center;
  gap: .375rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: .375rem .625rem;
  color: var(--foreground);
  background: var(--background);
  box-shadow: 0 2px 8px #0002;
  cursor: pointer;
}
.thinking-follow:hover { background: var(--muted); }
@media (max-height: 600px) { .thinking-scroll { max-height: 64dvh; } }
@media (prefers-reduced-motion: reduce) {
  .thinking-panel, .thinking-chevron, .thinking-preview, .thinking-heading { transition: none; }
}

function processCommand(e){
  const a=e.call.arguments||{};
  if(a.command)return [a.command,...(a.args||[]).map(v=>/\s/.test(String(v))?JSON.stringify(v):v)].join(' ');
  if(a.processId){
    const original=allEvents().find(x=>x.kind==='tool'&&x.call.name==='process_spawn'&&x.execution?.result?.processId===a.processId);
    if(original)return processCommand(original);
    return a.processId;
  }
  const pid=e.execution?.result?.snapshot?.pid;
  return typeof pid==='number'?'PID '+pid:'';
}
function toolInfo(e){
  const a=e.call.arguments||{},d=e.result?.details??e.execution?.result??{},n=e.call.name;
  let label=n,subject='',receipt='',symbol='code',origins=[];
  if(n==='file_read'){label='读取文件';symbol='file-text';subject=a.path||(a.files||[]).map(x=>x.path).filter(Boolean).join(', ');receipt=typeof a.startLine==='number'?'L'+a.startLine+(a.endLine?'–'+a.endLine:''):typeof a.offset==='number'?'从第 '+a.offset+' 字节读取':'';origins=['call.arguments.path / files[].path','call.arguments.startLine / endLine / offset'];}
  else if(n==='file_search'){label='搜索';symbol='search';subject=[a.query||(a.queries||[]).join(' · '),(a.paths||[]).join(', ')].filter(Boolean).join(' · ');receipt=Array.isArray(d.records)?d.records.length+' 项匹配':'';origins=['call.arguments.query / queries','call.arguments.paths','result.details.records.length'];}

  else if(n==='file_write'||n==='file_edit'){label=n==='file_write'?'写入文件':'编辑文件';symbol='file-edit';subject=a.path||'';origins=['call.arguments.path','call.arguments.content / edits[].oldText / edits[].newText','result.details.applied / status'];}
  else if(n.startsWith('process_')||n==='wait_process'){
    label=({process_spawn:'运行进程',process_read:'读取进程输出',process_write:'发送进程输入',process_inspect:'查看进程状态',process_stop:'停止进程',process_resize:'调整终端',wait_process:'等待进程'})[n]||n;symbol='terminal';subject=processCommand(e);
    if(n==='process_write'&&a.text)subject+=' · '+a.text.replace(/\n/g,' ↵ ');
    if(n==='process_resize')subject+=' · '+a.cols+' × '+a.rows;
    receipt=typeof d.snapshot?.exitCode==='number'?'退出码 '+d.snapshot.exitCode:typeof d.confirmedBytes==='number'?d.confirmedBytes+' 字节':'';
    origins=['call.arguments.command + args','call.arguments.processId → 已观测的 process_spawn','result.details.snapshot.exitCode / confirmedBytes'];
  } else if(n==='script_run'){
    const names=(e.children||[]).map(x=>x.call.name);
    label=a.title||(names.every(x=>['file_read','file_search','file_list'].includes(x))&&names.length?'读取与搜索文件':names.some(x=>x.startsWith('process_'))?'脚本与进程':'运行脚本');
    symbol='code-sslash';receipt=e.children?e.children.length+' 次调用':'JS';
    origins=['call.arguments.title（可选；本例未提供）','已观测子调用名称的固定分类','已观测子调用数量，不补造未加载调用'];
  } else if(n==='follow_up'){
    label='后续任务';symbol='timer';subject=({list:'列出',cancel:'取消',pause:'暂停',resume:'继续',register:'创建'})[a.action]||a.action||'';
    if(d.followup?.trigger?.path)subject+=' · '+d.followup.trigger.path;
    receipt=d.followup?.state==='cancelled'?'已取消':Array.isArray(d.followups)?d.followups.length+' 项':'';
    origins=['call.arguments.action','result.details.followup.state / trigger.path','result.details.followups'];
  } else if(n==='dispatch'){
    label=e.child?.name||d.name||a.name||'子任务';subject=a.task||'';origins=['child.name / result.details.name / call.arguments.name','call.arguments.task','child.state'];
  } else if(n==='ask_user'){label='询问';subject=a.questions?.[0]?.question||a.question||'';origins=a.questions?['提议扩展：call.arguments.questions[]','question / selection / options / required']:['call.arguments.question','call.arguments.options'];}
  else{subject='';origins=['call.name；通用参数没有可确定标题时留空'];}
  return {label,subject,receipt,symbol,origins};
}

function shortSubject(e,info){

  return new Set(same.map(x=>x.call.arguments.path)).size>1?parts.slice(-2).join('/'):base;

function questionsFor(e){

function questionDraft(e){

const hasAnswer=a=>Boolean(a&&(a.selectedOptionIds.length||a.text.trim()));
const pendingQuestions=()=>allEvents().filter(e=>e.kind==='tool'&&e.call.name==='ask_user'&&!e.result&&!state.questionReceipts[e.id]);

  body+=rawDetails(e);
  const head=I(info.symbol)+'<span class="tool-title"><span class="tool-label" title="'+H(info.label)+'">'+H(info.label)+'</span>'+(info.subject?'<span class="tool-subject" title="'+H(info.subject)+'">'+H(shortSubject(e,info))+'</span>':'')+'</span>'+

function renderEvent(e,context='normal'){

function leafTools(events){return events.flatMap(e=>e.kind==='tool'?e.call.name==='script_run'&&e.children?.length?leafTools(e.children):[e]:[]).filter(e=>e.call.name!=='dispatch'&&e.call.name!=='ask_user')}
function summary(events,active){
  const calls=leafTools(events);
  const pending=calls.filter(e=>['running','generating'].includes(statusOf(e)));
  if(active&&pending.length){const last=pending.at(-1),info=toolInfo(last);return (last.generating?'正在准备'+(info.label.endsWith('文件')?'文件操作':'调用'):'正在'+({file_read:'读取',file_search:'搜索',process_spawn:'运行',file_write:'写入',file_edit:'编辑'}[last.call.name]||info.label))+(info.subject?' '+shortSubject(last,info):'')+(pending.length>1?' · 另有 '+(pending.length-1)+' 项进行中':'');}
  if(active&&!calls.length&&events.some(e=>e.kind==='thinking'))return '正在思考';
  const successful=calls.filter(e=>statusOf(e)==='success');
  const reads=successful.filter(e=>e.call.name==='file_read');
  const search=successful.filter(e=>e.call.name==='file_search');
  const commands=successful.filter(e=>e.call.name==='process_spawn');
  const writes=successful.filter(e=>['file_edit','file_write'].includes(e.call.name)&&(e.result?.details?.applied===true||e.result?.details?.status==='applied'));
  const other=successful.length-reads.length-search.length-commands.length-writes.length;
  const parts=[];
  if(reads.length)parts.push('读取文件 '+reads.length+' 次');
  if(search.length)parts.push('搜索 '+search.length+' 次');
  if(commands.length)parts.push('运行命令 '+commands.length+' 次');
  if(writes.length)parts.push('修改 '+new Set(writes.map(e=>e.call.arguments.path)).size+' 个文件');
  if(other)parts.push('完成 '+other+' 项操作');
  const failures=calls.filter(e=>statusOf(e)==='error').length,unknown=calls.filter(e=>statusOf(e)==='unknown').length,background=calls.filter(e=>statusOf(e)==='background').length;
  if(failures)parts.push(failures+' 次失败');
  if(unknown)parts.push(unknown+' 项结果待确认');
  if(background)parts.push(background+' 项后台运行');
  if(!parts.length)parts.push(events.some(e=>e.kind==='thinking')?'思考过程':calls.some(e=>statusOf(e)==='cancelled')?'已取消':'执行过程');
  return parts.join(' · ');
}
function processGroup(events,id,active=false,sorted=false){
  if(!events.length)return '';
  return Fold(id,I('arrow-right-s','chevron')+(active?'<span class="running-dot"></span>':'')+
    '<span class="label">'+(sorted?'活动 · ':'')+H(summary(events,active))+'</span>',
    '<div class="process-body">'+events.map(e=>renderEvent(e,sorted?'activity':'normal')).join('')+'</div>',
    {defaultOpen:sorted&&state.prefs.activity==='summary'});
}
function renderEvents(events,runState=currentFrame().run.state){
  const active=['running','waiting'].includes(runState);
  if(state.mode==='live')return events.map(e=>renderEvent(e)+(e.children?e.children.filter(child=>child.call.name==='dispatch').map(renderChild).join(''):'')).join('');
  if(state.mode==='dialogue'){
    const projected=[];let group=null;
    for(const e of events){
      const direct=e.kind==='text'||e.kind==='history-turn';
      const standalone=e.kind==='permission'||e.kind==='retry'||e.kind==='connection'||e.kind==='tool'&&['dispatch','ask_user'].includes(e.call.name);
      if(direct){if(group)group.sealed=true;group=null;projected.push({e});}
      else if(standalone){projected.push({e});}
      else{if(!group){group={items:[],id:'process-'+e.id,sealed:false};projected.push(group);}group.items.push(e);}
      if(e.children)for(const child of e.children.filter(x=>x.call.name==='dispatch'))projected.push({e:child});
    }
    return projected.map(x=>x.e?renderEvent(x.e):processGroup(x.items,x.id,active&&!x.sealed)).join('');
  }
  const callsByRequest=new Set(events.filter(e=>e.kind==='tool').map(e=>e.requestId));
  const activity=[],standalone=[],answers=[],history=[];
  for(const e of events){
    if(e.kind==='history-turn'){history.push(e);continue;}
    if(e.kind==='permission'||e.kind==='retry'||e.kind==='connection'||e.kind==='tool'&&['dispatch','ask_user'].includes(e.call.name)){standalone.push(e);continue;}
    if(e.kind==='text'&&e.stopReason!=='toolUse'&&!callsByRequest.has(e.requestId))answers.push(e);
    else activity.push(e);
    if(e.children)standalone.push(...e.children.filter(x=>x.call.name==='dispatch'));
  }
  return history.map(e=>renderEvent(e)).join('')+processGroup(activity,'activity-'+(events[0]?.id||'empty'),active,true)+standalone.map(e=>renderEvent(e)).join('')+answers.map(e=>renderEvent(e)).join('');
}

    case 'manage-permission':{
      const id=button.dataset.permission,rule=state.permissionRules[id];
      openInspector('持续授权 · 工具与执行',rule?'<p>'+H(rule.host)+' · '+H(rule.account)+'</p><p>'+H(rule.tool)+' 写入 '+H(rule.path)+'</p><p>撤销后，后续匹配操作重新按权限规则判断；已经获准的这次操作保留原决定。</p>'+Btn('revoke-permission','撤销持续授权','button','data-permission="'+id+'"'):'<p>这条持续授权已撤销。本次操作的授权记录保留。</p>');break;
    }
    case 'revoke-permission':delete state.permissionRules[button.dataset.permission];byId('inspector').classList.remove('open');render();feedback('持续授权已撤销。');break;
    case 'bottom':state.follow=true;byId('thread-scroll').scrollTo({top:byId('thread-scroll').scrollHeight,behavior:'smooth'});button.hidden=true;break;
    case 'send':if(state.prompt.trim()){const running=['running','waiting'].includes(currentFrame().run.state);state.prompt='';byId('prompt').value='';feedback(running?'补充已加入示例队列。':'已记录示例输入。');if(running)button.hidden=true;}else byId('prompt')?.focus();break;
    case 'stop-run':stopPlayback();button.disabled=true;button.textContent='…';feedback('正在请求停止。');setTimeout(()=>{currentFrame().run.state='cancelled';render();},600);break;
    case 'copy-answer':{
      const text=currentFrame().events.filter(e=>e.kind==='text').map(e=>e.text).join('\n\n');
      if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>feedback('已复制回答。'),()=>openInspector('回答文本','<pre>'+H(text)+'</pre>'));
      else openInspector('回答文本','<pre>'+H(text)+'</pre>');break;
    }
    case 'inspect-operation':{
      const e=allEvents().find(x=>x.id===button.dataset.event);
      openInspector('原操作','<p>结果待确认；此处只查看原操作，不重新执行写入。</p><pre>'+H(JSON.stringify(rawOf(e),null,2))+'</pre>'+Btn('next','显示后续确认回执','button'));break;
    }
    case 'inspect-file':inspectEvent(button.dataset.event);break;
    case 'inspect-history':openInspector('本轮事件与呈现数据','<p>以下为本例共用的数据，工具标题没有额外描述字段。</p><pre>'+H(JSON.stringify(currentFrame(),null,2))+'</pre>');break;
    case 'inspect-scope':openInspector('工作区来源','<p>opencr · D:/project/opencr</p><p>真实导航保留原始 Thread、branch、history item 与文件来源，路径只是显示名称。</p>');break;
    case 'copy-prompt':if(navigator.clipboard)navigator.clipboard.writeText(currentScene().prompt).then(()=>feedback('已复制。'),()=>openInspector('消息文本','<pre>'+H(currentScene().prompt)+'</pre>'));else openInspector('消息文本','<pre>'+H(currentScene().prompt)+'</pre>');break;
    case 'save-provider':{
      const input=byId('provider-value');if(!input?.value.trim()){input?.focus();settingsFeedback('填写示例值后再保存。');break;}
      button.disabled=true;settingsFeedback('保存中…');setTimeout(()=>{state.settingsError=false;settingsFeedback('已保存');button.disabled=false;button.textContent='保存';const alert=document.querySelector('.settings-page [role="alert"]');alert?.remove();},550);break;
    }
    case 'edit-model':state.model.before={name:state.model.name,base:state.model.base,requestModel:state.model.requestModel};state.model.editing=true;render();break;
    case 'save-model':state.model.editing=false;state.settingsFeedback='已保存';render();break;
    case 'cancel-model':Object.assign(state.model,state.model.before||{});state.model.editing=false;render();break;
    case 'add-rule':state.retry.rules.push({field:'message',match:'contains',pattern:'',action:'retry'});render();break;
    case 'remove-rule':state.retry.rules.splice(Number(button.dataset.index),1);render();break;
    case 'save-retry':settingsFeedback('已保存重试设置 · 用于之后的新请求');break;
    case 'inherit-defaults':state.settingsCase='defaults';state.retry={enabled:true,maxRetries:2,initialDelayMs:1000,maxDelayMs:30000,rules:[]};render();settingsFeedback('已恢复继承');break;
    case 'cleanup-preview':state.storage.cleanPreview=true;render();break;
    case 'cleanup-cancel':state.storage.cleanPreview=false;render();break;
    case 'cleanup-confirm':button.disabled=true;button.textContent='正在清理…';setTimeout(()=>{state.storage.cleanPreview=false;state.storage.cleaned=true;render();},650);break;
    case 'inspect-storage-scope':openInspector('存储统计范围','<p>只统计应用管理的目录。共享数据库和内容寻址对象不重复分摊到工作区；原始项目目录不在扫描范围内。</p>');break;
    default:openInspector('保留现有操作','<p>这个入口保留现有产品操作。本稿不调用外部服务，也不替换该功能的实现。</p>');break;
  }
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='prompt'){state.prompt=el.value;const send=document.querySelector('[data-action="send"]');if(send)send.hidden=['running','waiting'].includes(currentFrame().run.state)&&!state.prompt.trim();}
  if(el.id==='plan-editor')state.planDraft=el.value;
  if(el.dataset.questionText){const e=activeQuestion();if(e){questionDraft(e).answers[el.dataset.questionText].text=el.value;refreshQuestionProgress();}}
  if(el.id==='settings-search'){state.search=el.value;renderSettings();const next=byId('settings-search');next.focus();next.setSelectionRange(next.value.length,next.value.length);}
  if(el.id==='frame-slider'){stopPlayback();state.frame=Number(el.value);render();}
  if(el.dataset.webField)state.web[el.dataset.webField]=el.value;
  if(el.dataset.modelField)state.model[el.dataset.modelField]=el.value;
  if(el.dataset.retryField)state.retry[el.dataset.retryField]=Number(el.value);
  if(el.dataset.rule!==undefined)state.retry.rules[Number(el.dataset.rule)][el.dataset.ruleField]=el.value;
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='scenario'){if(state.view==='settings')chooseSettings(el.value);else chooseScene(el.value);return;}
  if(el.id==='question-request'){state.questionActive=el.value;renderQuestionDock();return;}
  if(el.dataset.questionChoice){
    const e=activeQuestion();if(!e)return;
    const d=questionDraft(e),q=questionsFor(e).find(q=>q.id===el.dataset.questionChoice),a=d.answers[q.id];
    a.selectedOptionIds=q.selection==='multiple'?(el.checked?[...a.selectedOptionIds,el.value]:a.selectedOptionIds.filter(id=>id!==el.value)):[el.value];
    renderQuestionDock();return;
  }
  if(el.dataset.pref){
    const key=el.dataset.pref;
    if(key.startsWith('web.'))state.web[key.slice(4)]=el.checked;else if(key==='retry.enabled')state.retry.enabled=el.checked;else state.prefs[key]=el.checked;
    state.settingsFeedback='已保存';render();return;
  }
  if(el.dataset.setting==='provider'){state.web.provider=el.value;state.settingsError=false;render();return;}
  if(el.dataset.setting==='readerModel'){state.web.readerModel=el.value;state.settingsFeedback='已保存';render();return;}
  if(el.dataset.setting==='activity'){state.prefs.activity=el.value;render();return;}
  if(el.dataset.rule!==undefined)state.retry.rules[Number(el.dataset.rule)][el.dataset.ruleField]=el.value;
  if(el.hasAttribute('data-storage-scope')){state.storage.scope=el.value;render();}
  if(el.dataset.local)settingsFeedback('已保存');
});
document.addEventListener('scroll',event=>{
  const el=event.target;if(!(el instanceof Element))return;
  if(el.id==='thread-scroll'){state.scroll=el.scrollTop;state.follow=el.scrollHeight-el.scrollTop-el.clientHeight<4;const btn=document.querySelector('[data-action="bottom"]');if(btn)btn.hidden=state.follow;}
  if(el.dataset.thinkingScroll){const follow=el.scrollHeight-el.scrollTop-el.clientHeight<3;state.thoughtScroll.set(el.dataset.thinkingScroll,{top:el.scrollTop,follow});const btn=el.closest('.thinking-window')?.querySelector('.thinking-follow');if(btn)btn.hidden=follow;}
  if(el.dataset.outputScroll)state.thoughtScroll.set('output:'+el.dataset.outputScroll,{top:el.scrollTop,follow:el.scrollHeight-el.scrollTop-el.clientHeight<3});
},true);
document.addEventListener('transitionend',event=>{if(event.target.classList?.contains('fold')||event.target.classList?.contains('thinking-panel'))followAfterChange();});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(byId('inspector').classList.contains('open'))byId('inspector').classList.remove('open');else if(state.view==='settings'){state.view='chat';render();}else if(!state.questionHidden&&document.querySelector('.question-dock')){hideQuestionDock();}else{state.overview='closed';render();}}
  if(event.target.id==='prompt'&&event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();document.querySelector('[data-action="send"]')?.click();}
});
const initialScene=new URLSearchParams(location.search).get('scene');
if(scenarios.some(sc=>sc.id===initialScene))chooseScene(initialScene);
else render({keepScroll:false});
</script>
</body>
</html>
