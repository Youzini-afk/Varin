<!doctype html><meta charset="utf-8"><title>Varin reading/search authored pose review</title><style>body{background:#e9eef2;color:#304353;font:16px sans-serif;margin:24px}main{display:flex;gap:24px}img{max-width:100%}section{width:512px}h1{font-size:24px}p{max-width:1080px;line-height:1.5}</style><h1>阅读 / 检索 · 新直颈原画时序候选</h1><p>内部审查，不是最终runtime动画。使用真实生成中间原画与局部保留；不含整体旋转/缩放/形变插帧。重点检查头骨体积、脸部年龄、颈肩与头发遮挡、手部接触和回程。人物周边props尚未叠加。</p><main><section><h2>阅读：迎页 → 前倾 → 读入 → 翻页手势 → 回位</h2><img src="reading-normal-timing-v2.gif"></section><section><h2>检索：左候选 → 正位停顿 → 右候选 → 回屏选择</h2><img src="search-normal-timing-v2.gif"></section></main><h2>关键姿态同框</h2><img src="reading-search-keypose-sequence-v2.jpg"><h2>手部放大</h2><img src="hand-contact-qa-v2.jpg"><p>生成器实际做出人物右手（画面左侧）的翻页/选择动作，与prompt指定侧不同；保留了这一解剖连贯方案，另一手完全锁原锚。手势指向掌托/键盘区域，不宣称画面有独立清楚可见的触控板。首个过度俯身的准备候选已拒绝并排除。</p>
