[workspace]
members = ["crates/varin-kernel", "crates/varin-runtime"]
exclude = ["vendor/fuser"]
resolver = "2"

[patch.crates-io]
fuser = { path = "vendor/fuser" }

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.23.1"
hex = "0.4.3"
fs2 = "0.4.3"
imbl = { version = "7.0.2", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive", "rc"] }
serde_json = { version = "1.0.135", features = ["raw_value"] }
sha2 = "0.11.0"
thiserror = "2.0.11"
uuid = { version = "1.11.0", features = ["v4", "serde"] }

portable-pty = "=0.9.0"
encoding_rs = "=0.8.42"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem", "Win32_Security"] }

# R5: the same search engine and grammar ABI used by the Host, inside native workers.
grep-regex = "0.1.14"
grep-matcher = "0.1.8"
ignore = "0.4.25"
globset = "0.4.16"
tree-sitter = { version = "=0.27.1", features = ["wasm"] }
streaming-iterator = "0.1.9"

wasmparser = "0.262.0"
