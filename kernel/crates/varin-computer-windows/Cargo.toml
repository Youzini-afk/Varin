[package]
name = "varin-computer-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "VarinComputer"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_StationsAndDesktops", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Variant", "Win32_System_Threading",
  "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory",
  "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }
