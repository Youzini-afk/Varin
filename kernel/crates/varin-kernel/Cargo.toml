[package]
name = "varin-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Varin private Rust system kernel"

[features]
# Native access prototypes are opt-in until platform/cache and metadata
# qualification is complete. No component is installed by enabling this flag.
workspace-mount = ["dep:winfsp", "dep:fuser"]

[dependencies]
varin-runtime = { path = "../varin-runtime" }
base64.workspace = true
hex.workspace = true
fs2.workspace = true
imbl.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "sync", "macros"] }

portable-pty.workspace = true
encoding_rs.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
ignore.workspace = true
globset.workspace = true
tree-sitter.workspace = true
streaming-iterator.workspace = true
wasmparser.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_System_LibraryLoader"] }
winfsp = { version = "0.13.2", default-features = false, features = ["delayload"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
fuser = { version = "0.18.0", optional = true }
