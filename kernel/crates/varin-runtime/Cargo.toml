[package]
name = "varin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Varin native durable agent coordination and execution"

[dependencies]
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "macros", "sync"] }
