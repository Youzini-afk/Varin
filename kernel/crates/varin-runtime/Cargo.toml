[package]
name = "varin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Varin native durable agent coordination and execution"

[dependencies]
bytes = "1.12.1"
base64 = "0.22"
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "macros", "sync"] }
tiktoken-rs = "0.12.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
httpdate = "1"
