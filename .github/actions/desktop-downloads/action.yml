name: Varin desktop dependencies
description: Restore verified binary downloads before installing dependencies and preparing desktop tooling
inputs:
  electron:
    description: Prepare the native Electron runtime
    default: 'true'
  tools:
    description: Prepare the packaging/test toolchain
    default: 'true'
  package:
    description: Also prepare the platform installer packaging tools
    default: 'false'
runs:
  using: composite
  steps:
    - id: downloads
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
          ~/.cache/electron-builder
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron-builder/Cache
          packages/electron/resources/workspace-component
        key: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-${{ inputs.electron }}-${{ inputs.tools }}-${{ inputs.package }}-${{ hashFiles('bun.lock', 'packages/electron/resources/workspace-component.json') }}
        restore-keys: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    - shell: bash
      env:
        PREPARE_ELECTRON: ${{ inputs.electron }}
        PREPARE_TOOLS: ${{ inputs.tools }}
        PREPARE_PACKAGE: ${{ inputs.package }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/../../../packages/electron/scripts/prepare-build-downloads.mjs"
    # Preserve completed downloads even when a later compile/test fails.
    - if: steps.downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.downloads.outputs.cache-primary-key }}
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
          ~/.cache/electron-builder
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron-builder/Cache
          packages/electron/resources/workspace-component
