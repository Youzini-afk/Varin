name: Gmail plugin release
on:
  workflow_dispatch:
  push:
    tags:
      - "gmail-v*"
permissions:
  contents: read
concurrency:
  group: gmail-plugin-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/gmail-plugin-release.mjs
      - run: bun install --frozen-lockfile
      - run: node --test scripts/gmail-plugin-release.test.mjs
      - run: bun run --cwd packages/extension-cli build
      - run: bun run --cwd packages/extension-host build:dependencies
      - name: Link workspace author tooling
        run: |
          mkdir -p examples/extensions/gmail/node_modules/@varin
          ln -s ../../../../../packages/extension-sdk examples/extensions/gmail/node_modules/@varin/extension-sdk
          ln -s ../../../../../packages/extension-contract examples/extensions/gmail/node_modules/@varin/extension-contract
      - run: node --import tsx --test examples/extensions/gmail/gmail.test.ts examples/extensions/gmail/oauth.test.ts packages/extension-host/test/gmail-release.test.ts
      - run: node --import tsx packages/extension-cli/src/cli.ts release examples/extensions/gmail
      - uses: actions/upload-artifact@v7
        with:
          name: gmail-plugin-release
          path: examples/extensions/gmail/release/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'gmail-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gmail-plugin-release
          path: release
      - name: Publish the verified plugin artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --latest=false --title "Gmail ${GITHUB_REF_NAME#gmail-v}" --notes "Gmail plugin release. See the plugin README for OAuth application and callback setup.")
          version="${GITHUB_REF_NAME#gmail-v}"
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${options[@]}" release/*.tgz release/varin.release.json
