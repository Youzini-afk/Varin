name: Docker Commit Images

# Explicitly publish a main-history source without consuming a release version.
# Reviewed dispatch tooling stays separate from the exact source being built.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA in dispatch main history (empty selects dispatch SHA)
        required: false
        type: string
      resume_run_id:
        description: Original Docker Commit Images run with a verified candidate (no rebuild)
        required: false
        type: string
      resume_run_attempt:
        description: Original candidate attempt (empty selects the latest saved attempt of resume_run_id)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: varin-docker-commit-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  accept:
    name: Accept exact main-history source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.accept.outputs.source_sha }}
      version: ${{ steps.accept.outputs.version }}
      mode: ${{ steps.accept.outputs.mode }}
      build_run_id: ${{ steps.accept.outputs.build_run_id }}
      build_tooling_sha: ${{ steps.accept.outputs.build_tooling_sha }}
      build_run_attempt: ${{ steps.accept.outputs.build_run_attempt }}
      standard_app: ${{ steps.accept.outputs.standard_app }}
      toolbelt_app: ${{ steps.accept.outputs.toolbelt_app }}
      slim_base: ${{ steps.accept.outputs.slim_base }}
      toolbelt_base: ${{ steps.accept.outputs.toolbelt_base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve source and authenticate any recovery receipt
        id: accept
        working-directory: tooling
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          INPUT_RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-commit.mjs accept

  source-quality:
    name: Qualify exact commit source
    needs: accept
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.accept.outputs.source_sha }}
      full: true

  build-runtime-slim:
    name: Build commit slim runtime
    runs-on: ubuntu-latest
    needs: [accept, source-quality]
    if: needs.accept.outputs.mode == 'build'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact build source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.accept.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable multi-platform runtime candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile.base
          target: slim
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/youzini-afk/varin-runtime-slim:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Youzini-afk/Varin
            org.opencontainers.image.revision=${{ needs.accept.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.accept.outputs.version }}
            io.varin.publication.kind=commit
            io.varin.build.run_id=${{ github.run_id }}
            io.varin.build.run_attempt=${{ github.run_attempt }}
            io.varin.build.tooling_sha=${{ github.sha }}
          cache-from: type=gha,scope=varin-runtime-slim
          cache-to: type=gha,scope=varin-runtime-slim,mode=max

  build-runtime-toolbelt:
    name: Build commit toolbelt runtime
    runs-on: ubuntu-latest
    needs: [accept, source-quality]
    if: needs.accept.outputs.mode == 'build'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact build source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.accept.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable multi-platform runtime candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile.base
          target: toolbelt
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/youzini-afk/varin-runtime-toolbelt:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Youzini-afk/Varin
            org.opencontainers.image.revision=${{ needs.accept.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.accept.outputs.version }}
            io.varin.publication.kind=commit
            io.varin.build.run_id=${{ github.run_id }}
            io.varin.build.run_attempt=${{ github.run_attempt }}
            io.varin.build.tooling_sha=${{ github.sha }}
          cache-from: type=gha,scope=varin-runtime-base
          cache-to: type=gha,scope=varin-runtime-base,mode=max

  build-app-standard:
    name: Build commit standard application
    runs-on: ubuntu-latest
    needs: [accept, source-quality, build-runtime-slim]
    if: needs.accept.outputs.mode == 'build'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      base-image: ${{ steps.base.outputs.image }}
    steps:
      - name: Checkout dispatch tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact build source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.accept.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and freeze the runtime consumed by this application
        id: base
        working-directory: tooling
        env:
          SOURCE_SHA: ${{ needs.accept.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.accept.outputs.version }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_TOOLING_SHA: ${{ github.sha }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BASE_IMAGE: ghcr.io/youzini-afk/varin-runtime-slim@${{ needs.build-runtime-slim.outputs.digest }}
        run: node scripts/docker-commit.mjs resolve-base slim
      - name: Build immutable multi-platform application candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.base.outputs.image }}
            VARIN_SOURCE_REVISION=${{ needs.accept.outputs.source_sha }}
          tags: ghcr.io/youzini-afk/varin:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Youzini-afk/Varin
            org.opencontainers.image.revision=${{ needs.accept.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.accept.outputs.version }}
            io.varin.publication.kind=commit
            io.varin.build.run_id=${{ github.run_id }}
            io.varin.build.run_attempt=${{ github.run_attempt }}
            io.varin.build.tooling_sha=${{ github.sha }}
            io.varin.image.base=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=varin-app-slim
          cache-to: type=gha,scope=varin-app-slim,mode=max

  build-app-toolbelt:
    name: Build commit toolbelt application
    runs-on: ubuntu-latest
    needs: [accept, source-quality, build-runtime-toolbelt]
    if: needs.accept.outputs.mode == 'build'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      base-image: ${{ steps.base.outputs.image }}
    steps:
      - name: Checkout dispatch tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact build source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.accept.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and freeze the runtime consumed by this application
        id: base
        working-directory: tooling
        env:
          SOURCE_SHA: ${{ needs.accept.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.accept.outputs.version }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_TOOLING_SHA: ${{ github.sha }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BASE_IMAGE: ghcr.io/youzini-afk/varin-runtime-toolbelt@${{ needs.build-runtime-toolbelt.outputs.digest }}
        run: node scripts/docker-commit.mjs resolve-base toolbelt
      - name: Build immutable multi-platform application candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.base.outputs.image }}
            VARIN_SOURCE_REVISION=${{ needs.accept.outputs.source_sha }}
          tags: ghcr.io/youzini-afk/varin-toolbelt:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Youzini-afk/Varin
            org.opencontainers.image.revision=${{ needs.accept.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.accept.outputs.version }}
            io.varin.publication.kind=commit
            io.varin.build.run_id=${{ github.run_id }}
            io.varin.build.run_attempt=${{ github.run_attempt }}
            io.varin.build.tooling_sha=${{ github.sha }}
            io.varin.image.base=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=varin-app
          cache-to: type=gha,scope=varin-app,mode=max

  smoke-standard:
    name: Smoke exact commit standard application
    runs-on: ubuntu-latest
    needs: [accept, source-quality, build-app-standard]
    if: ${{ !cancelled() && needs.accept.result == 'success' && needs.source-quality.result == 'success' && (needs.accept.outputs.mode == 'resume' || needs.build-app-standard.result == 'success') }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.accept.outputs.mode == 'resume' && needs.accept.outputs.standard_app || format('ghcr.io/youzini-afk/varin@{0}', needs.build-app-standard.outputs.digest) }}
      EXPECTED_RELEASE_ID: image-${{ needs.accept.outputs.source_sha }}
      EXPECTED_VERSION: ${{ needs.accept.outputs.version }}
    steps:
      - name: Checkout dispatch tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact candidate
        run: docker pull --platform linux/amd64 "$IMAGE_REF"
      - name: Verify source identity, native services and real shutdown
        working-directory: tooling
        shell: bash
        run: |
          cleanup() {
            docker logs varin-commit-smoke 2>/dev/null || true
            docker rm --force varin-commit-smoke 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run --detach --name varin-commit-smoke --platform linux/amd64 \
            --env VARIN_UI_PASSWORD=varin-ci-smoke-only \
            --publish 127.0.0.1:3000:3000 "$IMAGE_REF"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' varin-commit-smoke | grep -qx true; then
              echo 'Varin container exited before readiness.' >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Varin did not become ready.' >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | node -e "let body='';process.stdin.on('data',chunk=>body+=chunk);process.stdin.on('end',()=>{const health=JSON.parse(body);if(health.releaseId!==process.env.EXPECTED_RELEASE_ID||health.varinVersion!==process.env.EXPECTED_VERSION)throw new Error(JSON.stringify(health));});"
          docker exec varin-commit-smoke node verify-kernel.mjs packages/web
          docker exec varin-commit-smoke node verify-services.mjs
          node scripts/smoke-container-stop.mjs varin-commit-smoke slim

  smoke-toolbelt:
    name: Smoke exact commit toolbelt application
    runs-on: ubuntu-latest
    needs: [accept, source-quality, build-app-toolbelt]
    if: ${{ !cancelled() && needs.accept.result == 'success' && needs.source-quality.result == 'success' && (needs.accept.outputs.mode == 'resume' || needs.build-app-toolbelt.result == 'success') }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.accept.outputs.mode == 'resume' && needs.accept.outputs.toolbelt_app || format('ghcr.io/youzini-afk/varin-toolbelt@{0}', needs.build-app-toolbelt.outputs.digest) }}
      EXPECTED_RELEASE_ID: image-${{ needs.accept.outputs.source_sha }}
      EXPECTED_VERSION: ${{ needs.accept.outputs.version }}
    steps:
      - name: Checkout dispatch tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact candidate
        run: docker pull --platform linux/amd64 "$IMAGE_REF"
      - name: Verify source identity, native services and real shutdown
        working-directory: tooling
        shell: bash
        run: |
          cleanup() {
            docker logs varin-commit-smoke 2>/dev/null || true
            docker rm --force varin-commit-smoke 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run --detach --name varin-commit-smoke --platform linux/amd64 \
            --env VARIN_UI_PASSWORD=varin-ci-smoke-only \
            --publish 127.0.0.1:3000:3000 "$IMAGE_REF"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' varin-commit-smoke | grep -qx true; then
              echo 'Varin container exited before readiness.' >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Varin did not become ready.' >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | node -e "let body='';process.stdin.on('data',chunk=>body+=chunk);process.stdin.on('end',()=>{const health=JSON.parse(body);if(health.releaseId!==process.env.EXPECTED_RELEASE_ID||health.varinVersion!==process.env.EXPECTED_VERSION)throw new Error(JSON.stringify(health));});"
          docker exec varin-commit-smoke node verify-kernel.mjs packages/web
          docker exec varin-commit-smoke node verify-services.mjs
          node scripts/smoke-container-stop.mjs varin-commit-smoke toolbelt

  record:
    # The recovery admission verifies this exact successful producer job.
    name: Record verified candidate
    runs-on: ubuntu-latest
    needs: [accept, source-quality, build-runtime-slim, build-runtime-toolbelt, build-app-standard, build-app-toolbelt, smoke-standard, smoke-toolbelt]
    if: ${{ !cancelled() && needs.accept.result == 'success' && needs.source-quality.result == 'success' && needs.smoke-standard.result == 'success' && needs.smoke-toolbelt.result == 'success' && (needs.accept.outputs.mode == 'resume' || (needs.build-runtime-slim.result == 'success' && needs.build-runtime-toolbelt.result == 'success' && needs.build-app-standard.result == 'success' && needs.build-app-toolbelt.result == 'success')) }}
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_name: ${{ steps.record.outputs.artifact_name }}
      artifact_attempt: ${{ steps.record.outputs.artifact_attempt }}
    steps:
      - name: Checkout dispatch tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the complete qualified digest set
        id: record
        working-directory: tooling
        env:
          SOURCE_SHA: ${{ needs.accept.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.accept.outputs.version }}
          PUBLICATION_MODE: ${{ needs.accept.outputs.mode }}
          BUILD_RUN_ID: ${{ needs.accept.outputs.build_run_id }}
          BUILD_TOOLING_SHA: ${{ needs.accept.outputs.build_tooling_sha }}
          BUILD_RUN_ATTEMPT: ${{ needs.accept.outputs.build_run_attempt }}
          STANDARD_APP_IMAGE: ${{ needs.accept.outputs.mode == 'resume' && needs.accept.outputs.standard_app || format('ghcr.io/youzini-afk/varin@{0}', needs.build-app-standard.outputs.digest) }}
          TOOLBELT_APP_IMAGE: ${{ needs.accept.outputs.mode == 'resume' && needs.accept.outputs.toolbelt_app || format('ghcr.io/youzini-afk/varin-toolbelt@{0}', needs.build-app-toolbelt.outputs.digest) }}
          SLIM_BASE_IMAGE: ${{ needs.accept.outputs.mode == 'resume' && needs.accept.outputs.slim_base || needs.build-app-standard.outputs.base-image }}
          TOOLBELT_BASE_IMAGE: ${{ needs.accept.outputs.mode == 'resume' && needs.accept.outputs.toolbelt_base || needs.build-app-toolbelt.outputs.base-image }}
        run: node scripts/docker-commit.mjs record
      - name: Retain the immutable recovery receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record.outputs.artifact_name }}
          path: tooling/artifacts/commit-images/candidate.json
          if-no-files-found: error
          overwrite: false

  promote:
    name: Publish verified commit images
    runs-on: ubuntu-latest
    needs: [accept, record]
    if: ${{ !cancelled() && needs.accept.result == 'success' && needs.record.result == 'success' }}
    # Shared with formal releases. No cancellation during multi-repository writes.
    concurrency:
      group: varin-docker-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout dispatch tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This runner has not pulled any candidate layers with authentication.
      # The publisher first proves anonymous pulls, then writes only commit-*.
      - name: Verify receipt, anonymous pulls and immutable promotion
        working-directory: tooling
        env:
          SOURCE_SHA: ${{ needs.accept.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.accept.outputs.version }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.record.outputs.artifact_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-commit.mjs promote
      - name: Retain the publication outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: varin-commit-publication-${{ github.run_attempt }}
          path: tooling/artifacts/commit-images/publication.json
          if-no-files-found: warn
          overwrite: false
