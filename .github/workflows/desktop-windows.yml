name: Windows Desktop Build
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Optional source ref to package
        required: false
        type: string
      architecture:
        description: Windows architecture to package
        required: true
        default: all
        type: choice
        options: [all, x64, arm64]
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare source and shared UI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Record exact source and selected targets
        id: source
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { releaseTargets } from './scripts/release-artifacts.mjs';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const targets = releaseTargets().filter(target => target.platform === 'windows' && (process.env.ARCHITECTURE === 'all' || target.architecture === process.env.ARCHITECTURE));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nmatrix=${JSON.stringify({ include: targets })}\n`);
          NODE
      - run: bun install --frozen-lockfile
      - run: node scripts/build-products.mjs frontend --export artifacts/shared-frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v7
        with:
          name: varin-frontend
          path: artifacts/shared-frontend/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
  package:
    needs: prepare
    uses: ./.github/workflows/desktop-package.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      tooling_sha: ${{ github.sha }}
      matrix: ${{ needs.prepare.outputs.matrix }}
