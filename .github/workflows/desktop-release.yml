name: Desktop Release Build

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag to package (for example v0.6.0)
        required: true
        type: string
      publish_release:
        description: Upload verified assets to an existing draft GitHub Release
        required: true
        default: false
        type: boolean
      include_macos_intel:
        description: Also package the slow macOS Intel target (manual opt-in)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-quality:
    name: Verify release source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run test:docs
      - run: bun run docs:validate
      - run: bun run type-check
      - run: bun run lint
      - name: Build and verify native kernel authority
        run: node scripts/test-kernel-authority.mjs --build
      - run: bun run test:pi
      - run: bun run test:cloud

  release-targets:
    name: Select release targets
    needs: release-quality
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Build target matrix
        id: targets
        env:
          INCLUDE_MACOS_INTEL: ${{ inputs.include_macos_intel }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const targets = [
            {
              label: 'Windows x64',
              platform: 'windows',
              target: 'win',
              architecture: 'x64',
              runner: 'windows-latest',
              artifact: 'latest-yml-x86_64-pc-windows-msvc',
            },
            {
              label: 'Windows ARM64',
              platform: 'windows',
              target: 'win',
              architecture: 'arm64',
              runner: 'windows-11-arm',
              artifact: 'latest-yml-aarch64-pc-windows-msvc',
            },
            {
              label: 'Linux x64',
              platform: 'linux',
              target: 'linux',
              architecture: 'x64',
              runner: 'ubuntu-latest',
              artifact: 'latest-yml-x86_64-unknown-linux-gnu',
            },
            {
              label: 'Linux ARM64',
              platform: 'linux',
              target: 'linux',
              architecture: 'arm64',
              runner: 'ubuntu-24.04-arm',
              artifact: 'latest-yml-aarch64-unknown-linux-gnu',
            },
            {
              label: 'macOS Apple Silicon',
              platform: 'macos',
              target: 'mac',
              architecture: 'arm64',
              runner: 'macos-15',
              artifact: 'latest-yml-aarch64-apple-darwin',
            },
          ];
          if (process.env.INCLUDE_MACOS_INTEL === 'true') {
            targets.push({
              label: 'macOS Intel',
              platform: 'macos',
              target: 'mac',
              architecture: 'x64',
              runner: 'macos-15-intel',
              artifact: 'latest-yml-x86_64-apple-darwin',
            });
          }
          process.stdout.write(`matrix=${JSON.stringify({ include: targets })}\n`);
          NODE

  package:
    name: Package and smoke ${{ matrix.label }}
    needs: release-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VARIN_TARGET_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}

      - name: Checkout current release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Record packaged source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(node -p 'require("./packages/electron/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require matching release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.release_ref }}" = "v${{ steps.source.outputs.version }}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Select Xcode with Icon Composer support
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$xcode_path"
          export DEVELOPER_DIR="$xcode_path/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
          xcrun --find actool

      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore source-built native libraries
        if: (matrix.platform == 'windows' && matrix.architecture == 'arm64') || (matrix.platform == 'macos' && matrix.architecture == 'x64')
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/varin-native/**/payload
            ~/.cache/varin-native/**/receipt.json
          key: native-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/electron/scripts/prepare-*-runtime.mjs') }}

      - name: Prepare target native libraries
        run: |
          node packages/electron/scripts/prepare-native-runtime.mjs
          node packages/electron/scripts/prepare-onnx-runtime.mjs

      - name: Cache verified native libraries
        if: steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/varin-native/**/payload
            ~/.cache/varin-native/**/receipt.json
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build native desktop package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos' && 'false' || '' }}
          # The Monaco production bundle exceeds V8's ~2 GiB default heap on the macOS ARM runner.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          bun run --cwd packages/electron build:web-assets
          bun run --cwd packages/electron prepare:pi-runtime
          bun run --cwd packages/electron bundle:main
          bun run --cwd packages/electron verify:native
          args=("--${{ matrix.target }}" "--${{ matrix.architecture }}" "--publish=never")
          if [ "${{ matrix.platform }}" = "macos" ]; then
            args+=("--varin-unsigned-mac")
          fi
          node packages/electron/scripts/package.mjs "${args[@]}"

      - name: Build and verify optional local semantic component
        run: node scripts/build-local-semantic-component.mjs --output packages/electron/release-assets

      - name: Smoke unpacked Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem -LiteralPath packages/electron/dist -Recurse -File -Filter Varin.exe |
            Where-Object { $_.FullName -match 'unpacked' } |
            Select-Object -First 1
          if (-not $executable) {
            throw 'Packaged Varin.exe was not found under an unpacked output directory.'
          }
          node .release-automation/packages/electron/scripts/smoke-windows-unpacked.mjs $executable.FullName

      - name: Verify and smoke Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ matrix.architecture }}"
          if [ "$suffix" = "x64" ]; then suffix=x86_64; fi
          appimage="packages/electron/dist/Varin-${{ steps.source.outputs.version }}-linux-${suffix}.AppImage"
          manifest="packages/electron/dist/latest-linux.yml"
          if [ "${{ matrix.architecture }}" = "arm64" ]; then
            manifest="packages/electron/dist/latest-linux-arm64.yml"
          fi
          node packages/electron/scripts/verify-update-manifest.mjs \
            "$manifest" "$appimage" "${{ steps.source.outputs.version }}"
          extract_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root"' EXIT
          chmod +x "$appimage"
          (cd "$extract_root" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          node --input-type=module -e '
            import { assertElfArchitecture, verifyExtractedPayload } from "./.release-automation/packages/electron/scripts/verify-linux-appimage.mjs";
            const targetArchitecture = process.env.VARIN_TARGET_ARCH;
            assertElfArchitecture(process.argv[1], targetArchitecture, "AppImage");
            verifyExtractedPayload({ root: process.argv[2], targetArchitecture });
          ' "$appimage" "$extract_root/squashfs-root"
          xvfb-run --auto-servernum node .release-automation/packages/electron/scripts/smoke-desktop-unpacked.mjs \
            "$extract_root/squashfs-root/AppRun" --no-sandbox

      - name: Verify and smoke macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find packages/electron/dist -type d -name Varin.app -print -quit)"
          test -n "$app"
          executable="$app/Contents/MacOS/Varin"
          expected_arch="${{ matrix.architecture }}"
          if [ "$expected_arch" = "x64" ]; then expected_arch=x86_64; fi
          file "$executable" | grep -q "$expected_arch"
          native_modules="$(find "$app/Contents/Resources/app.asar.unpacked" -type f -name '*.node')"
          test -n "$native_modules"
          runtime_native_modules=''
          while IFS= read -r native_module; do
            if [[ "$native_module" == *'/prebuilds/'* ]] \
              && [[ "$native_module" != *"/prebuilds/darwin-${{ matrix.architecture }}/"* ]] \
              && [[ "$native_module" != *"/prebuilds/darwin-${{ matrix.architecture }}.node" ]]; then
              continue
            fi
            runtime_native_modules="${runtime_native_modules}${runtime_native_modules:+$'\n'}${native_module}"
          done <<< "$native_modules"
          file "$app/Contents/Resources/kernel/varin-kernel" | grep -q "$expected_arch"
          printf '%s\n' "$runtime_native_modules" | grep -q "/triviumdb.darwin-${{ matrix.architecture }}.node$"
          for required in sherpa-onnx.node; do
            printf '%s\n' "$runtime_native_modules" | grep -q "/$required$"
          done
          while IFS= read -r native_module; do
            description="$(file "$native_module")"
            printf '%s\n' "$description"
            grep -q "$expected_arch" <<< "$description"
          done <<< "$runtime_native_modules"
          node .release-automation/packages/electron/scripts/smoke-desktop-unpacked.mjs "$executable"

      - name: Stage Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $assets = 'packages/electron/release-assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -LiteralPath "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-win-${{ matrix.architecture }}.exe" -Destination $assets
          Copy-Item -LiteralPath "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-win-${{ matrix.architecture }}.exe.blockmap" -Destination $assets
          Copy-Item -LiteralPath 'packages/electron/dist/latest.yml' -Destination $assets

      - name: Stage Linux release assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/electron/release-assets
          suffix="${{ matrix.architecture }}"
          manifest=latest-linux.yml
          if [ "$suffix" = "x64" ]; then suffix=x86_64; else manifest=latest-linux-arm64.yml; fi
          cp "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-linux-${suffix}.AppImage" \
            "packages/electron/dist/$manifest" packages/electron/release-assets/

      - name: Stage macOS release assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/electron/release-assets
          cp "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-mac-${{ matrix.architecture }}.dmg" \
            "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-mac-${{ matrix.architecture }}.zip" \
            packages/electron/dist/latest-mac.yml packages/electron/release-assets/
          for optional in \
            "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-mac-${{ matrix.architecture }}.dmg.blockmap" \
            "packages/electron/dist/Varin-${{ steps.source.outputs.version }}-mac-${{ matrix.architecture }}.zip.blockmap"; do
            if [ -f "$optional" ]; then cp "$optional" packages/electron/release-assets/; fi
          done

      - name: Upload verified native package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: packages/electron/release-assets/*
          retention-days: 14

  assemble:
    name: Assemble verified desktop release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}

      - name: Checkout current release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: latest-yml-*
          path: artifacts

      - name: Merge updater manifests and assemble assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/electron/package.json").version')"
          mkdir -p finalized release-assets
          LATEST_YML_DIR="$GITHUB_WORKSPACE/artifacts" \
            RUNNER_TEMP="$GITHUB_WORKSPACE/finalized" \
            GH_REPO="$GITHUB_REPOSITORY" \
            VARIN_VERSION="$version" \
            node .release-automation/packages/electron/scripts/finalize-latest-yml.mjs

          find artifacts -type f -name 'Varin-*' -exec cp {} release-assets/ \;
          find artifacts -type f \( -name 'latest-linux.yml' -o -name 'latest-linux-arm64.yml' \) \
            -exec cp {} release-assets/ \;
          cp finalized/latest.yml finalized/latest-arm64.yml finalized/latest-mac.yml release-assets/

          required_assets=(
            "Varin-${version}-win-x64.exe" \
            "Varin-${version}-win-arm64.exe" \
            "Varin-${version}-linux-x86_64.AppImage" \
            "Varin-${version}-linux-arm64.AppImage" \
            "Varin-${version}-mac-arm64.dmg" \
            "Varin-${version}-mac-arm64.zip" \
            latest.yml latest-arm64.yml latest-linux.yml latest-linux-arm64.yml latest-mac.yml
          )
          if [ "${{ inputs.include_macos_intel }}" = "true" ]; then
            required_assets+=(
              "Varin-${version}-mac-x64.dmg"
              "Varin-${version}-mac-x64.zip"
            )
          fi
          for required in "${required_assets[@]}"; do
            test -f "release-assets/$required" || { echo "Missing release asset: $required" >&2; exit 1; }
          done
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload complete desktop release artifact
        uses: actions/upload-artifact@v7
        with:
          name: varin-desktop-${{ inputs.release_ref }}
          if-no-files-found: error
          path: release-assets/*
          retention-days: 14

      - name: Upload verified assets to draft GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view '${{ inputs.release_ref }}' --json isDraft --jq '.isDraft')" = true
          gh release upload '${{ inputs.release_ref }}' release-assets/* --clobber
        
    permissions:
      contents: write
