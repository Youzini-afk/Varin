name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag to package (for example v0.9.34)
        required: true
        type: string
      publish_release:
        description: Upload verified assets to an existing draft GitHub Release
        required: true
        default: false
        type: boolean
      publish_draft:
        description: Publish the draft after verified assets are uploaded (requires publish_release)
        required: true
        default: false
        type: boolean
      include_macos_intel:
        description: Also package the slow macOS Intel target (manual opt-in)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Accept immutable release candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      android_code: ${{ steps.candidate.outputs.android_code }}
      matrix: ${{ steps.candidate.outputs.matrix }}
      linux_matrix: ${{ steps.candidate.outputs.linux_matrix }}
      component_matrix: ${{ steps.candidate.outputs.component_matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate publication options
        if: inputs.publish_draft && !inputs.publish_release
        run: exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve once; reuse the accepted source on retry
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VARIN_RELEASE_REF: ${{ inputs.release_ref }}
          INCLUDE_MACOS_INTEL: ${{ inputs.include_macos_intel }}
        run: node scripts/release-artifacts.mjs candidate --directory .release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: varin-release-candidate
          path: .release-candidate/candidate.json
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error

  frontend:
    name: Build shared browser assets once
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: node scripts/build-products.mjs frontend --export artifacts/shared-frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v7
        with:
          name: varin-frontend
          path: artifacts/shared-frontend/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  release-quality:
    name: Verify source quality
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run audit:dependencies
      - run: bun run test:docs
      - run: bun run --cwd packages/mobile test:release
      - run: bun run docs:validate
      - run: bun run type-check
      - run: bun run lint
      - run: bun run --sequential --no-exit-on-error --filter '!@varin/web' test
      - run: bun run test:tooling

  native-build:
    name: Build shared Linux x64 kernel
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - run: node scripts/build-products.mjs kernel --export artifacts/shared-kernel
      - uses: actions/upload-artifact@v7
        with:
          name: varin-kernel-linux-x64
          path: artifacts/shared-kernel/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  native-quality:
    name: Verify native authority and Host
    needs: [prepare, native-build]
    runs-on: ubuntu-latest
    env:
      VARIN_KERNEL_ARTIFACT: ${{ github.workspace }}/.build-input/kernel
      VARIN_TEST_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
      VARIN_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: varin-kernel-linux-x64
          path: .build-input/kernel
      - run: node scripts/build-products.mjs kernel
      - run: bun run build:type-dependencies
      - name: Prepare FUSE for native workspace acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      - run: node scripts/test-kernel-authority.mjs
      - run: bun run --cwd packages/web test

  vm-guest:
    name: Prepare Linux x64 VM runtime
    needs: [prepare, frontend, native-build]
    runs-on: ubuntu-latest
    env:
      VARIN_FRONTEND_ARTIFACT: ${{ github.workspace }}/.build-input/frontend
      VARIN_KERNEL_ARTIFACT: ${{ github.workspace }}/.build-input/kernel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: varin-frontend
          path: .build-input/frontend
      - uses: actions/download-artifact@v8
        with:
          name: varin-kernel-linux-x64
          path: .build-input/kernel
      - run: node scripts/build-vm-guest-bundle.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: varin-vm-guest-x64
          path: packages/computer-driver/linux/guest-bundle-x64/
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  package:
    name: Desktop packages
    needs: [prepare, frontend]
    uses: ./.github/workflows/desktop-package.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      tooling_sha: ${{ github.sha }}
      release_ref: ${{ inputs.release_ref }}
      matrix: ${{ needs.prepare.outputs.matrix }}

  linux-x64:
    name: Linux x64 package
    needs: [prepare, frontend, native-build, vm-guest]
    uses: ./.github/workflows/desktop-package.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      tooling_sha: ${{ github.sha }}
      release_ref: ${{ inputs.release_ref }}
      matrix: ${{ needs.prepare.outputs.linux_matrix }}
      reuse_linux_kernel: true

  components:
    name: Optional inference components
    needs: prepare
    uses: ./.github/workflows/desktop-components.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      tooling_sha: ${{ github.sha }}
      matrix: ${{ needs.prepare.outputs.component_matrix }}

  android:
    name: Build and verify signed Android APK
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    env:
      VARIN_RELEASE_REF: ${{ inputs.release_ref }}
      VARIN_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      VARIN_RELEASE_TOOLING_SHA: ${{ github.sha }}
      VARIN_FRONTEND_ARTIFACT: ${{ github.workspace }}/.build-input/frontend
      # This workflow is the single official Android build counter. Reruns retain it.
      VARIN_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
      VARIN_ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Prepare Android release signing and optional push configuration
        env:
          VARIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.VARIN_ANDROID_KEYSTORE_BASE64 }}
          VARIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VARIN_ANDROID_KEYSTORE_PASSWORD }}
          VARIN_ANDROID_KEY_ALIAS: ${{ secrets.VARIN_ANDROID_KEY_ALIAS }}
          VARIN_ANDROID_KEY_PASSWORD: ${{ secrets.VARIN_ANDROID_KEY_PASSWORD }}
          VARIN_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.VARIN_ANDROID_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const required = ['VARIN_ANDROID_KEYSTORE_BASE64', 'VARIN_ANDROID_KEYSTORE_PASSWORD', 'VARIN_ANDROID_KEY_ALIAS', 'VARIN_ANDROID_KEY_PASSWORD'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error(`Configure Android release secrets: ${missing.join(', ')}`);
          const keystore = path.join(process.env.RUNNER_TEMP, 'varin-android-release.keystore');
          fs.writeFileSync(keystore, Buffer.from(process.env.VARIN_ANDROID_KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `VARIN_ANDROID_KEYSTORE_PATH=${keystore}\n`);
          if (process.env.VARIN_ANDROID_GOOGLE_SERVICES_JSON) {
            const config = JSON.parse(process.env.VARIN_ANDROID_GOOGLE_SERVICES_JSON);
            if (!config.client?.some(client => client.client_info?.android_client_info?.package_name === 'dev.varin.mobile')) {
              throw new Error('Firebase configuration must include dev.varin.mobile.');
            }
            fs.writeFileSync('packages/mobile/android/app/google-services.json', JSON.stringify(config), { mode: 0o600 });
          } else {
            console.log('Firebase is not configured; Android push registration remains unavailable.');
          }
          NODE

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: varin-frontend
          path: .build-input/frontend

      - name: Build, verify signature and stage Android APK
        env:
          VARIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VARIN_ANDROID_KEYSTORE_PASSWORD }}
          VARIN_ANDROID_KEY_ALIAS: ${{ secrets.VARIN_ANDROID_KEY_ALIAS }}
          VARIN_ANDROID_KEY_PASSWORD: ${{ secrets.VARIN_ANDROID_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run mobile:build:android:release

      - name: Record verified Android provenance
        run: node scripts/release-artifacts.mjs record --directory packages/mobile/release-assets --kind android --platform android --arch universal

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          path: packages/mobile/release-assets/*
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Remove temporary Android signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/varin-android-release.keystore" packages/mobile/android/app/google-services.json

  assemble:
    name: Assemble verified desktop and Android release
    needs: [prepare, release-quality, native-quality, package, linux-x64, components, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Checkout current release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            packages/electron
            scripts
            kernel/protocol
          path: .release-automation

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: latest-yml-*
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android-apk

      - uses: actions/download-artifact@v8
        with:
          pattern: component-*
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: varin-release-candidate
          path: .release-candidate
      - name: Verify every product belongs to the accepted source and is complete
        run: node .release-automation/scripts/release-artifacts.mjs verify --directory artifacts --candidate .release-candidate/candidate.json

      - name: Merge updater manifests and assemble assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/electron/package.json").version')"
          mkdir -p finalized release-assets
          LATEST_YML_DIR="$GITHUB_WORKSPACE/artifacts" \
            RUNNER_TEMP="$GITHUB_WORKSPACE/finalized" \
            GH_REPO="$GITHUB_REPOSITORY" \
            VARIN_VERSION="$version" \
            node .release-automation/packages/electron/scripts/finalize-latest-yml.mjs

          find artifacts -type f -name 'Varin-*' -exec cp {} release-assets/ \;
          find artifacts -type f \( -name 'latest-linux.yml' -o -name 'latest-linux-arm64.yml' \) \
            -exec cp {} release-assets/ \;
          cp finalized/latest.yml finalized/latest-arm64.yml finalized/latest-mac.yml release-assets/

          required_assets=(
            "Varin-${version}-win-x64.exe" \
            "Varin-${version}-win-arm64.exe" \
            "Varin-${version}-linux-x86_64.AppImage" \
            "Varin-${version}-linux-arm64.AppImage" \
            "Varin-${version}-mac-arm64.dmg" \
            "Varin-${version}-mac-arm64.zip" \
            "Varin-${version}-android.apk" \
            "Varin-${version}-android.apk.sha256" \
            latest.yml latest-arm64.yml latest-linux.yml latest-linux-arm64.yml latest-mac.yml
          )
          if [ "${{ inputs.include_macos_intel }}" = "true" ]; then
            required_assets+=(
              "Varin-${version}-mac-x64.dmg"
              "Varin-${version}-mac-x64.zip"
            )
          fi
          for required in "${required_assets[@]}"; do
            test -f "release-assets/$required" || { echo "Missing release asset: $required" >&2; exit 1; }
          done
          (cd release-assets && sha256sum --check "Varin-${version}-android.apk.sha256")
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Record source and checksums for all final assets
        run: node .release-automation/scripts/release-artifacts.mjs finalize --directory release-assets --candidate .release-candidate/candidate.json

      - name: Upload complete release artifact
        uses: actions/upload-artifact@v7
        with:
          name: varin-release-${{ inputs.release_ref }}
          if-no-files-found: error
          path: release-assets/*
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload verified assets to draft GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view '${{ inputs.release_ref }}' --json isDraft --jq '.isDraft')" = true
          node .release-automation/scripts/release-artifacts.mjs assert-ref --candidate .release-candidate/candidate.json
          gh release upload '${{ inputs.release_ref }}' release-assets/* --clobber

      - name: Publish completed GitHub Release
        if: inputs.publish_release && inputs.publish_draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node .release-automation/scripts/release-artifacts.mjs assert-ref --candidate .release-candidate/candidate.json
          gh release edit '${{ inputs.release_ref }}' --draft=false --latest

    permissions:
      contents: write
