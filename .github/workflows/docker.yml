name: Docker Images

# Validation belongs to CI/container-check. Only an explicitly selected release
# tag may write candidates or public aliases; a main push publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      runtime_base_image:
        description: Optional toolbelt runtime-base; its resolved digest also becomes a published companion base (select a release tag)
        required: false
        type: string
      runtime_slim_image:
        description: Optional slim runtime-base; its resolved digest also becomes a published companion base (select a release tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: varin-docker-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  TOOLBELT_APP_IMAGE_NAME: youzini-afk/varin-toolbelt
  STANDARD_APP_IMAGE_NAME: youzini-afk/varin
  TOOLBELT_BASE_IMAGE_NAME: youzini-afk/varin-runtime-toolbelt
  SLIM_BASE_IMAGE_NAME: youzini-afk/varin-runtime-slim

jobs:
  candidate:
    name: Accept exact release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/docker-release.mjs accept

  source-quality:
    name: Qualify exact release source
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.sha }}
      full: true

  build-runtime-slim:
    name: Build runtime slim candidate
    runs-on: ubuntu-latest
    needs: [source-quality]
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.runtime_slim_image == '') }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime slim labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SLIM_BASE_IMAGE_NAME }}

      - name: Build and push immutable runtime slim candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          target: slim
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.SLIM_BASE_IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=varin-runtime-slim
          cache-to: type=gha,scope=varin-runtime-slim,mode=max

  build-runtime-toolbelt:
    name: Build runtime toolbelt candidate
    runs-on: ubuntu-latest
    needs: [source-quality]
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.runtime_base_image == '') }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime base labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.TOOLBELT_BASE_IMAGE_NAME }}

      - name: Build and push immutable runtime base candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          target: toolbelt
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.TOOLBELT_BASE_IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=varin-runtime-base
          cache-to: type=gha,scope=varin-runtime-base,mode=max

  build-app-standard:
    name: Build Varin standard app candidate
    runs-on: ubuntu-latest
    needs: [source-quality, build-runtime-slim]
    if: ${{ !cancelled() && needs.source-quality.result == 'success' && (needs.build-runtime-slim.result == 'success' || needs.build-runtime-slim.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      base-image: ${{ steps.runtime-slim.outputs.image }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract slim app labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.STANDARD_APP_IMAGE_NAME }}

      - name: Resolve immutable runtime slim
        id: runtime-slim
        shell: bash
        env:
          BASE_OVERRIDE: ${{ inputs.runtime_slim_image || '' }}
          BASE_DIGEST: ${{ needs.build-runtime-slim.outputs.digest }}
          BASE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.SLIM_BASE_IMAGE_NAME }}
        run: node scripts/docker-release.mjs resolve-base slim

      - name: Build and push immutable Varin slim app candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.runtime-slim.outputs.image }}
            VARIN_SOURCE_REVISION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.STANDARD_APP_IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=varin-app-slim
          cache-to: type=gha,scope=varin-app-slim,mode=max

  build-app-toolbelt:
    name: Build Varin toolbelt app candidate
    runs-on: ubuntu-latest
    needs: [source-quality, build-runtime-toolbelt]
    if: ${{ !cancelled() && needs.source-quality.result == 'success' && (needs.build-runtime-toolbelt.result == 'success' || needs.build-runtime-toolbelt.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      base-image: ${{ steps.runtime-base.outputs.image }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.TOOLBELT_APP_IMAGE_NAME }}

      - name: Resolve immutable runtime base
        id: runtime-base
        shell: bash
        env:
          BASE_OVERRIDE: ${{ inputs.runtime_base_image || '' }}
          BASE_DIGEST: ${{ needs.build-runtime-toolbelt.outputs.digest }}
          BASE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.TOOLBELT_BASE_IMAGE_NAME }}
        run: node scripts/docker-release.mjs resolve-base toolbelt

      - name: Build and push immutable Varin app candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.runtime-base.outputs.image }}
            VARIN_SOURCE_REVISION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.TOOLBELT_APP_IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=varin-app
          cache-to: type=gha,scope=varin-app,mode=max

  smoke-toolbelt:
    name: Smoke immutable amd64 toolbelt candidate
    runs-on: ubuntu-latest
    needs: [build-app-toolbelt]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ghcr.io/youzini-afk/varin-toolbelt@${{ needs.build-app-toolbelt.outputs.digest }}
      EXPECTED_RELEASE_ID: image-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable candidate
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Verify health, native kernel and brokered services
        shell: bash
        run: |
          cleanup() {
            docker logs varin-smoke 2>/dev/null || true
            docker rm --force varin-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name varin-smoke \
            --platform linux/amd64 \
            --env VARIN_UI_PASSWORD=varin-ci-smoke-only \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_REF"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' varin-smoke | grep -qx true; then
              echo "Varin container exited before becoming healthy." >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Varin /health did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | node -e "let body='';process.stdin.on('data',(chunk)=>body+=chunk);process.stdin.on('end',()=>{const health=JSON.parse(body);if(health.releaseId!==process.env.EXPECTED_RELEASE_ID)throw new Error(JSON.stringify(health));});"

          docker exec varin-smoke node verify-kernel.mjs packages/web
          docker exec varin-smoke node verify-services.mjs
          node scripts/smoke-container-stop.mjs varin-smoke toolbelt

  smoke-standard:
    name: Smoke immutable amd64 standard candidate
    runs-on: ubuntu-latest
    needs: [build-app-standard]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ghcr.io/youzini-afk/varin@${{ needs.build-app-standard.outputs.digest }}
      EXPECTED_RELEASE_ID: image-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable slim candidate
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Verify health, native kernel and brokered services
        shell: bash
        run: |
          cleanup() {
            docker logs varin-slim-smoke 2>/dev/null || true
            docker rm --force varin-slim-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name varin-slim-smoke \
            --platform linux/amd64 \
            --env VARIN_UI_PASSWORD=varin-ci-smoke-only \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_REF"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' varin-slim-smoke | grep -qx true; then
              echo "Varin slim container exited before becoming healthy." >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Varin slim /health did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | node -e "let body='';process.stdin.on('data',(chunk)=>body+=chunk);process.stdin.on('end',()=>{const health=JSON.parse(body);if(health.releaseId!==process.env.EXPECTED_RELEASE_ID)throw new Error(JSON.stringify(health));});"

          docker exec varin-slim-smoke node verify-kernel.mjs packages/web
          docker exec varin-slim-smoke node verify-services.mjs
          node scripts/smoke-container-stop.mjs varin-slim-smoke slim

  promote:
    name: Promote verified release image tags
    runs-on: ubuntu-latest
    needs: [source-quality, build-runtime-toolbelt, build-runtime-slim, build-app-toolbelt, build-app-standard, smoke-toolbelt, smoke-standard]
    if: ${{ !cancelled() && needs.source-quality.result == 'success' && needs.build-app-toolbelt.result == 'success' && needs.build-app-standard.result == 'success' && needs.smoke-toolbelt.result == 'success' && needs.smoke-standard.result == 'success' && (needs.build-runtime-toolbelt.result == 'success' || needs.build-runtime-toolbelt.result == 'skipped') && (needs.build-runtime-slim.result == 'success' || needs.build-runtime-slim.result == 'skipped') }}
    # Other release tags may build in parallel, but public alias updates cannot
    # interleave or be cancelled by a newer push halfway through the set.
    concurrency:
      group: varin-docker-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck, stage publicly readable candidates and promote tested digests
        env:
          VARIN_STANDARD_APP_IMAGE: ghcr.io/youzini-afk/varin@${{ needs.build-app-standard.outputs.digest }}
          VARIN_TOOLBELT_APP_IMAGE: ghcr.io/youzini-afk/varin-toolbelt@${{ needs.build-app-toolbelt.outputs.digest }}
          VARIN_SLIM_BASE_IMAGE: ${{ needs.build-app-standard.outputs.base-image }}
          VARIN_TOOLBELT_BASE_IMAGE: ${{ needs.build-app-toolbelt.outputs.base-image }}
        run: node scripts/docker-release.mjs promote
