name: Docker Images

# Validation belongs to CI/container-check. Only an explicitly selected release
# tag may write candidates or public aliases; a main push publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag to publish using current main tooling (empty uses the selected tag)
        required: false
        type: string
      resume_run_id:
        description: Reuse successful image build from this Docker Images run; qualify and smoke it again
        required: false
        type: string
      resume_run_attempt:
        description: Build attempt to reuse (empty selects the latest saved build)
        required: false
        type: string
      replace_version:
        description: Republish the selected version after moving its Git tag; preserve all SHA image tags
        required: true
        default: false
        type: boolean
      runtime_base_image:
        description: Optional toolbelt runtime-base; its resolved digest also becomes a published companion base (select a release tag)
        required: false
        type: string
      runtime_slim_image:
        description: Optional slim runtime-base; its resolved digest also becomes a published companion base (select a release tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: varin-docker-release-${{ inputs.release_ref && format('refs/tags/{0}', inputs.release_ref) || github.ref }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  TOOLBELT_APP_IMAGE_NAME: youzini-afk/varin-toolbelt
  STANDARD_APP_IMAGE_NAME: youzini-afk/varin
  TOOLBELT_BASE_IMAGE_NAME: youzini-afk/varin-runtime-toolbelt
  SLIM_BASE_IMAGE_NAME: youzini-afk/varin-runtime-slim

jobs:
  candidate:
    name: Accept exact release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.accept.outputs.source_sha }}
      version: ${{ steps.accept.outputs.version }}
      release_ref: ${{ steps.accept.outputs.release_ref }}
      mode: ${{ steps.accept.outputs.mode }}
      standard_app: ${{ steps.accept.outputs.standard_app }}
      toolbelt_app: ${{ steps.accept.outputs.toolbelt_app }}
      slim_base: ${{ steps.accept.outputs.slim_base }}
      toolbelt_base: ${{ steps.accept.outputs.toolbelt_base }}
      build_run_id: ${{ steps.accept.outputs.build_run_id }}
      build_run_attempt: ${{ steps.accept.outputs.build_run_attempt }}
      build_tooling_sha: ${{ steps.accept.outputs.build_tooling_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: accept
        env:
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          INPUT_RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
          INPUT_SLIM_BASE: ${{ inputs.runtime_slim_image }}
          INPUT_TOOLBELT_BASE: ${{ inputs.runtime_base_image }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-release-candidate.mjs

  source-quality:
    name: Qualify exact release source
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.candidate.outputs.source_sha }}
      full: true
      qualification: container

  build-images:
    name: Build release image candidates
    needs: candidate
    if: needs.candidate.outputs.mode == 'build'
    uses: ./.github/workflows/container-images.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.candidate.outputs.source_sha }}
      tooling_sha: ${{ github.sha }}
      version: ${{ needs.candidate.outputs.version }}
      publication: release
      release_ref: ${{ needs.candidate.outputs.release_ref }}
      runtime_slim_image: ${{ inputs.runtime_slim_image || '' }}
      runtime_base_image: ${{ inputs.runtime_base_image || '' }}

  smoke-toolbelt:
    name: Smoke immutable amd64 toolbelt candidate
    runs-on: ubuntu-latest
    needs: [candidate, build-images]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.candidate.outputs.mode == 'resume' || needs.build-images.result == 'success') }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.toolbelt_app || needs.build-images.outputs.toolbelt_app }}
      EXPECTED_RELEASE_ID: image-${{ needs.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable candidate
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Verify health, native kernel and brokered services
        shell: bash
        run: |
          cleanup() {
            docker logs varin-smoke 2>/dev/null || true
            docker rm --force varin-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name varin-smoke \
            --platform linux/amd64 \
            --env VARIN_UI_PASSWORD=varin-ci-smoke-only \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_REF"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' varin-smoke | grep -qx true; then
              echo "Varin container exited before becoming healthy." >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Varin /health did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | node -e "let body='';process.stdin.on('data',(chunk)=>body+=chunk);process.stdin.on('end',()=>{const health=JSON.parse(body);if(health.releaseId!==process.env.EXPECTED_RELEASE_ID)throw new Error(JSON.stringify(health));});"

          docker exec varin-smoke node verify-kernel.mjs packages/web
          docker exec varin-smoke node verify-services.mjs
          node scripts/smoke-container-stop.mjs varin-smoke toolbelt

  smoke-standard:
    name: Smoke immutable amd64 standard candidate
    runs-on: ubuntu-latest
    needs: [candidate, build-images]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.candidate.outputs.mode == 'resume' || needs.build-images.result == 'success') }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.standard_app || needs.build-images.outputs.standard_app }}
      EXPECTED_RELEASE_ID: image-${{ needs.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable slim candidate
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Verify health, native kernel and brokered services
        shell: bash
        run: |
          cleanup() {
            docker logs varin-slim-smoke 2>/dev/null || true
            docker rm --force varin-slim-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name varin-slim-smoke \
            --platform linux/amd64 \
            --env VARIN_UI_PASSWORD=varin-ci-smoke-only \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_REF"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' varin-slim-smoke | grep -qx true; then
              echo "Varin slim container exited before becoming healthy." >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Varin slim /health did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/health \
            | node -e "let body='';process.stdin.on('data',(chunk)=>body+=chunk);process.stdin.on('end',()=>{const health=JSON.parse(body);if(health.releaseId!==process.env.EXPECTED_RELEASE_ID)throw new Error(JSON.stringify(health));});"

          docker exec varin-slim-smoke node verify-kernel.mjs packages/web
          docker exec varin-slim-smoke node verify-services.mjs
          node scripts/smoke-container-stop.mjs varin-slim-smoke slim

  promote:
    name: Promote verified release image tags
    runs-on: ubuntu-latest
    needs: [candidate, source-quality, build-images, smoke-toolbelt, smoke-standard]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.source-quality.result == 'success' && (needs.candidate.outputs.mode == 'resume' || needs.build-images.result == 'success') && needs.smoke-toolbelt.result == 'success' && needs.smoke-standard.result == 'success' }}
    # Other release tags may build in parallel, but public alias updates cannot
    # interleave or be cancelled by a newer push halfway through the set.
    concurrency:
      group: varin-docker-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck, stage publicly readable candidates and promote tested digests
        env:
          VARIN_REPLACE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_version || false }}
          VARIN_RELEASE_REF: ${{ needs.candidate.outputs.release_ref }}
          VARIN_RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          VARIN_RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          VARIN_RELEASE_TOOLING_SHA: ${{ github.sha }}
          VARIN_STANDARD_APP_IMAGE: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.standard_app || needs.build-images.outputs.standard_app }}
          VARIN_TOOLBELT_APP_IMAGE: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.toolbelt_app || needs.build-images.outputs.toolbelt_app }}
          VARIN_SLIM_BASE_IMAGE: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.slim_base || needs.build-images.outputs.slim_base }}
          VARIN_TOOLBELT_BASE_IMAGE: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.toolbelt_base || needs.build-images.outputs.toolbelt_base }}
          VARIN_BUILD_RUN_ID: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.build_run_id || needs.build-images.outputs.build_run_id }}
          VARIN_BUILD_RUN_ATTEMPT: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.build_run_attempt || needs.build-images.outputs.build_run_attempt }}
          VARIN_BUILD_TOOLING_SHA: ${{ needs.candidate.outputs.mode == 'resume' && needs.candidate.outputs.build_tooling_sha || needs.build-images.outputs.build_tooling_sha }}
        run: node scripts/docker-release.mjs promote
