name: Publish npm packages

on:
  push:
    tags:
      - "npm-v*"

permissions:
  contents: read
  id-token: write

# All five packages share one exact version stream. Serializing tags prevents an older run from
# moving npm's latest tag after a newer release, and a publish already in progress is never cancelled.
concurrency:
  group: varin-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a source commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the verified npm Trusted Publishing client
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify coordinated version
        run: bun run release:npm:verify "$GITHUB_REF_NAME"

      - name: Test public tooling
        run: bun run release:npm:test

      - name: Build public tooling
        run: bun run release:npm:build

      - name: Pack and smoke exact artifacts
        run: bun run release:npm:package "$GITHUB_REF_NAME" "$RUNNER_TEMP/varin-npm-release"

      - name: Preserve exact publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: varin-npm-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/varin-npm-release

      - name: Publish with npm Trusted Publishing
        run: bun run release:npm:publish "$GITHUB_REF_NAME" "$RUNNER_TEMP/varin-npm-release"
