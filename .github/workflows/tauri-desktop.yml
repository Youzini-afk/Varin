name: Native Tauri candidate
on:
  workflow_call:
    inputs:
      authorized_tools:
        description: Caller has explicit approval for documented native runner tool installations
        type: boolean
        default: false
      source_sha:
        required: true
        type: string
      full:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  frontend:
    if: inputs.authorized_tools
    name: Prepare one native candidate source
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Verify immutable source and choose native runners
        id: targets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FULL: ${{ inputs.full }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const all = [
            { platform: 'linux', architecture: 'x64', runner: 'ubuntu-24.04' },
            { platform: 'win32', architecture: 'x64', runner: 'windows-latest' },
            { platform: 'darwin', architecture: 'arm64', runner: 'macos-15' },
            { platform: 'linux', architecture: 'arm64', runner: 'ubuntu-24.04-arm' },
            { platform: 'win32', architecture: 'arm64', runner: 'windows-11-arm' },
            { platform: 'darwin', architecture: 'x64', runner: 'macos-15-intel' },
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: process.env.FULL === 'true' ? all : all.slice(0, 3) })}\n`);
          JS
      - run: bun run --cwd packages/tauri test:tooling
      - run: node scripts/build-products.mjs frontend --export artifacts/tauri-shared-frontend
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-shared-frontend
          path: artifacts/tauri-shared-frontend/
          include-hidden-files: true
          if-no-files-found: error

  native:
    name: Build and exercise ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.frontend.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      CEF_PATH: ${{ github.workspace }}/artifacts/tauri-input/cef
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/tauri-cargo
      VARIN_FRONTEND_ARTIFACT: ${{ github.workspace }}/artifacts/tauri-input/frontend
      VARIN_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.VARIN_TAURI_UPDATER_PUBLIC_KEY }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install native Linux GUI/build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config libssl-dev libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libegl1-mesa-dev libvulkan-dev libnss3 libasound2t64 libgbm1 libxss1 libxtst6 mesa-vulkan-drivers xauth xvfb dbus-x11 fuse3 xdg-desktop-portal xdg-desktop-portal-gtk
          pkg-config --atleast-version=4.14 gtk4
      - name: Select current macOS SDK
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/tauri-input/cef
          key: tauri-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'packages/tauri/src-tauri/Cargo.lock', 'packages/tauri/scripts/cef-runtime.lock.json') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: tauri-shared-frontend
          path: artifacts/tauri-input/frontend
      # The native scope test starts the production extension broker, which
      # imports the real workspace contracts rather than a stand-in fixture.
      - name: Prepare shared runtime contracts for native integration tests
        run: bun run build:runtime-dependencies
      - name: Verify native owner logic
        run: cargo test --manifest-path packages/tauri/src-tauri/Cargo.toml --no-default-features --locked
      - name: Build controlled old-engine reader
        run: node packages/tauri/scripts/prepare-exporter.mjs artifacts/tauri-input/exporter
      - name: Fetch fixed Node and prepare shared Host runtime
        shell: bash
        run: |
          node packages/tauri/scripts/node-runtime.mjs fetch
          node packages/tauri/scripts/stage-desktop.mjs --output artifacts/tauri-runtime --legacy-electron artifacts/tauri-input/exporter/source
      - name: Exercise actual bundled Node, kernel, Knowledge and extension broker
        run: node packages/tauri/scripts/smoke-runtime.mjs artifacts/tauri-runtime
      - name: Build actual release-mode native shell and preserved installer
        run: node packages/tauri/scripts/build-candidate.mjs --runtime artifacts/tauri-runtime --output artifacts/tauri-candidate
      - name: Exercise real CEF windows, browser, sandbox and native drain on Linux
        if: matrix.platform == 'linux'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node packages/tauri/scripts/smoke-native.mjs artifacts/tauri-candidate/candidate.json --output artifacts/tauri-native-smoke.json
      - name: Exercise real CEF windows, browser, sandbox and native drain
        if: matrix.platform != 'linux'
        run: node packages/tauri/scripts/smoke-native.mjs artifacts/tauri-candidate/candidate.json --output artifacts/tauri-native-smoke.json
      - name: Preserve exact candidate and observed evidence (not release qualification)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-candidate-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            artifacts/tauri-candidate/assets/
            artifacts/tauri-candidate/candidate.json
            artifacts/tauri-native-smoke.json
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
