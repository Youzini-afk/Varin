name: Native Tauri candidate
on:
  workflow_dispatch:
    inputs:
      authorized_tools:
        description: Approval covers the documented official native runner tools
        type: boolean
        default: false
      source_sha:
        description: Immutable committed source to build and exercise
        required: true
        type: string
      full:
        description: Exercise all six existing native desktop targets
        type: boolean
        default: true
      target:
        description: Focus one native target only when full is false
        type: string
        default: ''
      performance:
        description: Collect complete same-source Linux desktop observations under a declared virtual display
        type: boolean
        default: false
  workflow_call:
    inputs:
      authorized_tools:
        description: Caller has explicit approval for documented native runner tool installations
        type: boolean
        default: false
      source_sha:
        required: true
        type: string
      full:
        type: boolean
        default: true
      target:
        type: string
        default: ''
      performance:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  frontend:
    if: inputs.authorized_tools
    name: Prepare one native candidate source
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Verify immutable source and choose native runners
        id: targets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FULL: ${{ inputs.full }}
          TARGET: ${{ inputs.target }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { selectNativeTargets } from './packages/tauri/scripts/native-targets.mjs';
          const include = selectNativeTargets({ full: process.env.FULL === 'true', target: process.env.TARGET });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          JS
      - run: bun run --cwd packages/tauri test:tooling
      - run: node scripts/build-products.mjs frontend --export artifacts/tauri-shared-frontend
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-shared-frontend
          path: artifacts/tauri-shared-frontend/
          include-hidden-files: true
          if-no-files-found: error

  native:
    name: Build and exercise ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.frontend.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.performance && 180 || 100 }}
    env:
      CEF_PATH: ${{ github.workspace }}/artifacts/tauri-input/cef
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/tauri-cargo
      VARIN_FRONTEND_ARTIFACT: ${{ github.workspace }}/artifacts/tauri-input/frontend
      VARIN_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.VARIN_TAURI_UPDATER_PUBLIC_KEY }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install native Linux GUI/build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config libssl-dev libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libegl1-mesa-dev libvulkan-dev libnss3 libasound2t64 libgbm1 libxss1 libxtst6 mesa-vulkan-drivers xauth xvfb xdotool openbox dbus-x11 fuse3 xdg-desktop-portal xdg-desktop-portal-gtk
          pkg-config --atleast-version=4.14 gtk4
      - name: Select current macOS SDK
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
      - name: Select pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: actions/cache/restore@v6
        id: native-inputs
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'packages/tauri/src-tauri/Cargo.lock') }}
      - uses: actions/cache/restore@v6
        id: cef-inputs
        with:
          path: artifacts/tauri-input/cef
          key: tauri-cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/tauri/scripts/cef-runtime.lock.json') }}
      - run: bun install --frozen-lockfile
      - name: Verify native macOS installation observations
        if: matrix.platform == 'darwin'
        run: node --test packages/tauri/scripts/macos-installer-smoke.test.mjs
      - uses: actions/download-artifact@v8
        with:
          name: tauri-shared-frontend
          path: artifacts/tauri-input/frontend
      # The native scope test starts the production extension broker, which
      # imports the real workspace contracts rather than a stand-in fixture.
      - name: Prepare shared runtime contracts for native integration tests
        run: bun run build:runtime-dependencies
      - name: Verify native owner logic
        timeout-minutes: 15
        run: cargo test --manifest-path packages/tauri/src-tauri/Cargo.toml --no-default-features --locked
      - name: Build controlled old-engine reader
        run: node packages/tauri/scripts/prepare-exporter.mjs artifacts/tauri-input/exporter
      - name: Fetch fixed Node and prepare shared Host runtime
        shell: bash
        run: |
          node packages/tauri/scripts/node-runtime.mjs fetch
          node packages/tauri/scripts/stage-desktop.mjs --output artifacts/tauri-runtime --legacy-electron artifacts/tauri-input/exporter/source
      - name: Exercise actual bundled Node, kernel, Knowledge and extension broker
        run: node packages/tauri/scripts/smoke-runtime.mjs artifacts/tauri-runtime
      - name: Build actual release-mode native shell and preserved installer
        id: candidate
        run: node packages/tauri/scripts/build-candidate.mjs --runtime artifacts/tauri-runtime --output artifacts/tauri-candidate
      - name: Prepare the explicit pinned old-engine fixture executor
        run: node packages/electron/scripts/ensure-electron.mjs
      # This must precede a bare native smoke: only a known fresh OS profile may
      # be admitted for the synthetic old-engine fixture. The lifecycle driver
      # itself runs the complete native suite twice from the installed product.
      - name: Exercise real Linux portable lifecycle and application-data handoff
        if: matrix.platform == 'linux'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node packages/tauri/scripts/installer-smoke.mjs artifacts/tauri-candidate/candidate.json --output artifacts/tauri-installer-smoke --disposable-runner
      - name: Exercise real Windows installation, migration, reinstall and uninstall
        if: matrix.platform == 'win32'
        run: node packages/tauri/scripts/installer-smoke.mjs artifacts/tauri-candidate/candidate.json --output artifacts/tauri-installer-smoke --disposable-runner
      - name: Exercise real macOS DMG copy-install, replacement and removal
        if: matrix.platform == 'darwin'
        run: node packages/tauri/scripts/macos-installer-smoke.mjs artifacts/tauri-candidate/candidate.json --output artifacts/tauri-installer-smoke --disposable-runner
      - name: Build the complete same-source Electron performance baseline
        if: inputs.performance && matrix.platform == 'linux' && matrix.architecture == 'x64'
        run: node packages/tauri/scripts/benchmark-build.mjs --candidate artifacts/tauri-candidate/candidate.json --output artifacts/desktop-benchmark-products
      - name: Observe complete products on a declared virtual display
        if: inputs.performance && matrix.platform == 'linux' && matrix.architecture == 'x64'
        env:
          VARIN_BENCHMARK_DISPOSABLE_OS_USER: '1'
          VARIN_BENCHMARK_VIRTUAL_DISPLAY: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node packages/tauri/scripts/benchmark-suite.mjs --pair artifacts/desktop-benchmark-products/pair.json --output artifacts/desktop-benchmark-evidence
      - name: Preserve measurements without synthetic profiles or credentials
        if: always() && inputs.performance && matrix.platform == 'linux' && matrix.architecture == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-benchmark-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            artifacts/desktop-benchmark-evidence/**/preflight.json
            artifacts/desktop-benchmark-evidence/**/comparison.json
            artifacts/desktop-benchmark-evidence/**/probe.json
            artifacts/desktop-benchmark-evidence/**/suite.json
            artifacts/desktop-benchmark-evidence/measurements/**/*.json
            artifacts/desktop-benchmark-evidence/measurements/**/*.jsonl
          if-no-files-found: warn
          retention-days: 14
      # A failed native check must not force all six runners to download the
      # exact same verified sources/SDK again. Keep executable build outputs out.
      - name: Preserve downloaded build sources
        if: ${{ !cancelled() && steps.native-inputs.outcome == 'success' && steps.native-inputs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.native-inputs.outputs.cache-primary-key }}
      - name: Preserve the completed fixed CEF SDK
        if: ${{ !cancelled() && steps.cef-inputs.outcome == 'success' && steps.cef-inputs.outputs.cache-hit != 'true' && hashFiles('artifacts/tauri-input/cef/**/archive.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: artifacts/tauri-input/cef
          key: ${{ steps.cef-inputs.outputs.cache-primary-key }}
      - name: Preserve exact candidate and observed evidence (not release qualification)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-candidate-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            artifacts/tauri-candidate/assets/
            artifacts/tauri-candidate/candidate.json
            artifacts/tauri-native-smoke.json
            artifacts/tauri-installer-smoke/*.json
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
