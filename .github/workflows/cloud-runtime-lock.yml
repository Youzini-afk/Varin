name: Cloud runtime lockfile

# This repository keeps two lockfiles. Dependabot maintains the workspace `bun.lock`, but
# `scripts/build-cloud-runtime.mjs` assembles a separate production runtime workspace and verifies
# its own `scripts/cloud-runtime.bun.lock` frozen, so any bump inside that graph fails the container
# and production-build jobs until the second lockfile is refreshed too.
#
# This cannot run automatically on the pull request. Workflows triggered by Dependabot receive a
# read-only GITHUB_TOKEN regardless of the permissions requested, so they cannot push. The
# alternatives are `pull_request_target`, which would check out branch content and run an install
# with a writable token, or a long-lived personal access token. Neither is worth it for a chore, so
# this is dispatched deliberately and only then holds write access.
#
# One consequence to expect: GitHub does not start new workflow runs for a push made with
# GITHUB_TOKEN, so the pull request's checks keep describing the previous commit after this runs.
# Re-run them, or close and reopen the pull request, to get a verdict on the refreshed lockfile.

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Number of the Dependabot pull request to refresh
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cloud-runtime-lock-${{ inputs.pull-request }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh cloud runtime lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Refuse anything that is not a Dependabot pull request, so a dispatch cannot be used to push
      # a commit onto an arbitrary branch.
      - name: Verify the pull request is from Dependabot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pull-request }}
        run: |
          set -euo pipefail
          author=$(gh pr view "$PR" --json author --jq '.author.login')
          echo "author=$author"
          case "$author" in
            dependabot|app/dependabot|dependabot[bot]) ;;
            *)
              echo "::error::Refusing to push to a pull request authored by '$author'."
              exit 1
              ;;
          esac

      - name: Check out the pull request branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pull-request }}
        run: gh pr checkout "$PR"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The workspace lockfile already matches, because Dependabot maintains it.
      - run: bun install --frozen-lockfile

      # `update:cloud-runtime-lock` stages existing package build outputs rather than building, so
      # the workspace has to be built first, the same order the production-build job uses.
      - run: bun run build

      # Regenerates scripts/cloud-runtime.bun.lock. The underlying install runs with
      # `--ignore-scripts`, so no package lifecycle script executes here.
      - run: bun run update:cloud-runtime-lock

      - name: Commit the refreshed lockfile
        env:
          PR: ${{ inputs.pull-request }}
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/cloud-runtime.bun.lock; then
            echo "No cloud runtime lockfile change; nothing to push."
            exit 0
          fi

          # Only the second lockfile may travel with this commit. Anything else means the run did
          # more than the chore it is scoped to, and pushing it would hide that.
          # Compare content, not file modes. Installing a workspace sets the executable bit on
          # declared `bin` entries, which shows up as a change with no added or removed lines and is
          # never a reason to stop a lockfile refresh. `--numstat` reports `-` for binary files, so
          # those still count as changed.
          unexpected=$(
            git diff --numstat -- . ':!scripts/cloud-runtime.bun.lock' \
              | awk '$1 != "0" || $2 != "0" { print $3 }'
          )
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changes outside the cloud runtime lockfile:"
            echo "$unexpected"
            echo "--- diff ---"
            git diff --stat -- . ':!scripts/cloud-runtime.bun.lock'
            git diff -- . ':!scripts/cloud-runtime.bun.lock' | head -80
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cloud-runtime.bun.lock
          git commit \
            -m 'build(deps): refresh cloud runtime lockfile' \
            -m 'The cloud runtime workspace keeps its own lockfile and CI verifies it frozen, so it has to move with the dependency bump in this pull request.'
          git push
          echo "Pushed a refreshed lockfile to pull request #$PR."
          echo "::notice::A push made with GITHUB_TOKEN does not start new workflow runs, so the \
          checks on #$PR still describe the previous commit. Re-run them, or close and reopen the \
          pull request, to get a verdict on the refreshed lockfile."
