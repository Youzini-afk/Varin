name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: varin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change surface
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.surface.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: surface
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '(^docs/|^packages/docs/|\.mdx?$|^\.github/readme/|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test:docs
      - run: bun run docs:validate
      - if: needs.changes.outputs.code == 'true'
        run: bun audit
      - if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-audit@0.22.2
      - if: needs.changes.outputs.code == 'true'
        name: Audit Rust kernel dependencies
        run: cargo audit --file kernel/Cargo.lock
      - if: needs.changes.outputs.code == 'true'
        run: bun run type-check
      - if: needs.changes.outputs.code == 'true'
        run: bun run lint
      - if: needs.changes.outputs.code == 'true'
        name: Build and verify native kernel authority
        run: node scripts/test-kernel-authority.mjs --build
      - if: needs.changes.outputs.code == 'true'
        run: bun run test:pi
      - if: needs.changes.outputs.code == 'true'
        run: bun run test:cloud

  windows-runtime:
    name: Windows runtime
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build:type-dependencies
      - name: Build and verify native kernel authority
        run: node scripts/test-kernel-authority.mjs --build
      - run: bun run test:pi
      - run: |
          bun run --cwd packages/electron test:architecture
          bun run --cwd packages/electron test:updater
          bun run --cwd packages/electron test:linux-desktop

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Imports the built server artifact under plain Node: vitest's CJS
      # interop hides require/import mismatches that break `node server/index.js`.
      - name: Smoke built server artifact under Node
        run: node --test packages/web/application-host/lib/knowledge/store.smoke.test.ts
      - run: bun run build:cloud-runtime -- --skip-build --no-archive --output artifacts/cloud-runtime-ci
      - name: Smoke atomic cloud deployment and rollback
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/varin-cloud-deploy"
          DATA_DIR="$ROOT/data"
          GOOD_ARCHIVE="$RUNNER_TEMP/varin-cloud-good.tgz"
          BAD_SOURCE="$RUNNER_TEMP/varin-cloud-bad-source.tgz"
          BAD_ARCHIVE="$RUNNER_TEMP/varin-cloud-bad.tgz"
          IDEMPOTENT_ARCHIVE="$RUNNER_TEMP/varin-cloud-idempotent.tgz"
          INSECURE_ENV_ARCHIVE="$RUNNER_TEMP/varin-cloud-insecure-env.tgz"
          INSECURE_ENV_FILE="$RUNNER_TEMP/varin-cloud-insecure.env"
          LINK_ARCHIVE="$RUNNER_TEMP/varin-cloud-link-failure.tgz"
          LOCK_ARCHIVE="$RUNNER_TEMP/varin-cloud-lock-failure.tgz"
          PORT=$(node -e "const server=require('node:net').createServer();server.listen(0,'127.0.0.1',()=>{console.log(server.address().port);server.close();});")

          cleanup() {
            if [ -f "$ROOT/current/packages/web/bin/cli.js" ]; then
              VARIN_DATA_DIR="$DATA_DIR" node "$ROOT/current/packages/web/bin/cli.js" stop --port "$PORT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          verify_good() {
            test "$(basename "$(readlink -f "$ROOT/current")")" = "$GOOD_RELEASE"
            node --input-type=module -e "const response=await fetch('http://127.0.0.1:${PORT}/health');const body=await response.json();if(!response.ok||body.status!=='ok'||body.releaseId!=='${GOOD_RELEASE}'||body.piRuntime?.ready!==true||body.piRuntime?.source!=='bundled')throw new Error(JSON.stringify(body));"
          }

          node scripts/build-cloud-runtime.mjs \
            --skip-build \
            --output "$RUNNER_TEMP/varin-cloud-runtime" \
            --archive "$GOOD_ARCHIVE"
          cp "$GOOD_ARCHIVE" "$BAD_SOURCE"
          GOOD_SHA=$(sha256sum "$GOOD_ARCHIVE" | awk '{print $1}')
          GOOD_RELEASE="good-${GOOD_SHA:0:16}"

          bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$GOOD_ARCHIVE" \
            --sha256 "$GOOD_SHA" \
            --release-id "$GOOD_RELEASE" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR"

          verify_good

          cp "$BAD_SOURCE" "$IDEMPOTENT_ARCHIVE"
          bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$IDEMPOTENT_ARCHIVE" \
            --sha256 "$GOOD_SHA" \
            --release-id "$GOOD_RELEASE" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR"
          verify_good

          cp "$BAD_SOURCE" "$INSECURE_ENV_ARCHIVE"
          printf '%s\n' 'VARIN_UI_PASSWORD=not-a-real-secret' > "$INSECURE_ENV_FILE"
          chmod 0644 "$INSECURE_ENV_FILE"
          if bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$INSECURE_ENV_ARCHIVE" \
            --sha256 "$GOOD_SHA" \
            --release-id "insecure-env-${GOOD_SHA:0:16}" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR" \
            --env-file "$INSECURE_ENV_FILE"; then
            echo "Deployment unexpectedly sourced a group/world-readable secret file." >&2
            exit 1
          fi
          verify_good

          cp "$BAD_SOURCE" "$LOCK_ARCHIVE"
          printf '%s\n' "$$" > "$ROOT/.deploy.lock"
          if bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$LOCK_ARCHIVE" \
            --sha256 "$GOOD_SHA" \
            --release-id "locked-${GOOD_SHA:0:16}" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR"; then
            echo "Concurrent deployment unexpectedly acquired the active lock." >&2
            exit 1
          fi
          rm -f "$ROOT/.deploy.lock"
          verify_good

          cp "$BAD_SOURCE" "$LINK_ARCHIVE"
          FAKE_BIN="$RUNNER_TEMP/varin-cloud-fake-bin"
          MV_FAILURE_MARKER="$RUNNER_TEMP/varin-cloud-mv-failed"
          REAL_MV=$(command -v mv)
          mkdir "$FAKE_BIN"
          cat > "$FAKE_BIN/mv" <<EOF
          #!/usr/bin/env bash
          if [ "\${1:-}" = "-Tf" ] && [ ! -e "$MV_FAILURE_MARKER" ]; then
            touch "$MV_FAILURE_MARKER"
            exit 73
          fi
          exec "$REAL_MV" "\$@"
          EOF
          chmod +x "$FAKE_BIN/mv"
          if PATH="$FAKE_BIN:$PATH" bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$LINK_ARCHIVE" \
            --sha256 "$GOOD_SHA" \
            --release-id "link-failure-${GOOD_SHA:0:16}" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR"; then
            echo "Deployment with an injected current-link failure unexpectedly succeeded." >&2
            exit 1
          fi
          test -e "$MV_FAILURE_MARKER"
          verify_good

          mkdir "$RUNNER_TEMP/varin-cloud-bad"
          tar -xzf "$BAD_SOURCE" -C "$RUNNER_TEMP/varin-cloud-bad"
          node -e "require('node:fs').writeFileSync(process.argv[1], 'throw new Error(\"intentional cloud rollback smoke failure\");\n')" \
            "$RUNNER_TEMP/varin-cloud-bad/packages/web/server/index.js"
          tar -czf "$BAD_ARCHIVE" -C "$RUNNER_TEMP/varin-cloud-bad" .
          BAD_SHA=$(sha256sum "$BAD_ARCHIVE" | awk '{print $1}')

          if bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$BAD_ARCHIVE" \
            --sha256 "$BAD_SHA" \
            --release-id "$GOOD_RELEASE" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR"; then
            echo "A release id was unexpectedly reused for a different archive." >&2
            exit 1
          fi
          verify_good

          if bash scripts/deploy-cloud-runtime.sh \
            --root "$ROOT" \
            --archive "$BAD_ARCHIVE" \
            --sha256 "$BAD_SHA" \
            --release-id "bad-${BAD_SHA:0:16}" \
            --port "$PORT" \
            --bind-host 127.0.0.1 \
            --data-dir "$DATA_DIR" \
            --health-timeout 5; then
            echo "Broken cloud runtime unexpectedly deployed successfully." >&2
            exit 1
          fi

          verify_good
      - run: bun run test:pi:dist
