# DIAGNOSTIC-ONLY BRANCH: DO NOT MERGE. Restore the ordinary CI workflow with
# the actual repair. This job observes the existing live-shell failure; it does
# not replace or relax any acceptance requirement on main.
name: Windows terminal stall probe (DO NOT MERGE)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-terminal-stall:
    name: Capture pending native shell stop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:type-dependencies
      - run: bun run --cwd packages/web type-check:application-host:tests
      - name: Build the exact probe kernel
        run: node scripts/test-kernel-authority.mjs --build-only
      - name: Preserve the exact compiled probe inputs
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Capture the first failure without retrying it
        timeout-minutes: 15
        # Match the original failing CI launcher. The terminal inherits this
        # process environment, including Git Bash/MSYS context.
        shell: bash
        env:
          VARIN_TEST_TERMINAL_TRACE: stalled
        run: |
          # Independent fresh fixtures sample the intermittent race. A failure
          # terminates this job immediately; it can never become retry-to-green.
          for iteration in $(seq 1 12); do
            echo "Git Bash live-shell stop sample $iteration / 12"
            node scripts/test-kernel-authority.mjs --vitest-file=application-host/lib/terminal/shell-integration.live.native.test.ts
          done
