name: Backend memory experiment (diagnostic branch only)
run-name: Backend memory 4 CPU 4 GiB ${{ inputs.profile }} for ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact application source to measure
        required: true
        default: 246cc03b294970399df0d17f71ce8915ce3b275f
      profile:
        description: Mixed ten-minute request load, or sustained full-CPU file checksums
        type: choice
        options: [mixed, cpu]
        default: mixed
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify exact application source
        working-directory: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Start isolated build registry
        run: docker run --detach --name varin-memory-registry --publish 127.0.0.1:5000:5000 registry:2
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Build exact slim base
        uses: docker/build-push-action@v7
        with:
          context: candidate
          file: candidate/Dockerfile.base
          target: slim
          platforms: linux/amd64
          pull: true
          push: true
          tags: localhost:5000/varin-runtime-slim:memory
          cache-from: type=gha,scope=varin-check-runtime-slim
      - name: Build exact slim app
        uses: docker/build-push-action@v7
        with:
          context: candidate
          file: candidate/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: varin:memory-slim
          build-args: |
            RUNTIME_BASE_IMAGE=localhost:5000/varin-runtime-slim:memory
            VARIN_SOURCE_REVISION=${{ inputs.source_sha }}
          cache-from: type=gha,scope=varin-check-app
      - name: Measure slim
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BENCHMARK_PROFILE: ${{ inputs.profile }}
        run: bash harness/benchmarks/backend-memory/run.sh varin:memory-slim slim "$SOURCE_SHA" evidence/slim
      - name: Upload slim observations promptly
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-memory-slim-${{ inputs.source_sha }}
          path: evidence/slim
          retention-days: 30
          if-no-files-found: warn
      - name: Release slim output image
        if: always()
        run: docker image rm varin:memory-slim 2>/dev/null || true
      - name: Build exact toolbelt base
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v7
        with:
          context: candidate
          file: candidate/Dockerfile.base
          target: toolbelt
          platforms: linux/amd64
          pull: true
          push: true
          tags: localhost:5000/varin-runtime-toolbelt:memory
          cache-from: type=gha,scope=varin-check-runtime-base
      - name: Build exact toolbelt app
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v7
        with:
          context: candidate
          file: candidate/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: varin:memory-toolbelt
          build-args: |
            RUNTIME_BASE_IMAGE=localhost:5000/varin-runtime-toolbelt:memory
            VARIN_SOURCE_REVISION=${{ inputs.source_sha }}
          cache-from: type=gha,scope=varin-check-app
      - name: Measure toolbelt
        if: ${{ !cancelled() }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BENCHMARK_PROFILE: ${{ inputs.profile }}
        run: bash harness/benchmarks/backend-memory/run.sh varin:memory-toolbelt toolbelt "$SOURCE_SHA" evidence/toolbelt
      - name: Upload raw and summarized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-memory-${{ inputs.source_sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
      - name: Cleanup disposable registry
        if: always()
        run: docker rm --force varin-memory-registry 2>/dev/null || true
