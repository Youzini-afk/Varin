name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      container_benchmark:
        description: Measure cold, warm and clean-builder registry cache reuse without publication
        default: false
        type: boolean
  schedule:
    # Complete qualification is owned here, not silently deferred forever.
    - cron: '17 3 * * *'
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      full:
        default: true
        type: boolean
      qualification:
        description: Product to qualify; ordinary CI retains every applicable platform
        default: all
        type: string

permissions:
  contents: read

concurrency:
  # Ordinary pushes supersede old validation, not explicit release checks or
  # the complete daily qualification that owns deferred platform combinations.
  group: varin-ci-${{ (inputs.source_sha != '' || github.event_name == 'workflow_dispatch') && github.run_id || github.event_name == 'schedule' && 'qualification' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.source_sha == '' && github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Identify affected owners
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.surface.outputs.code }}
      frontend: ${{ steps.surface.outputs.frontend }}
      native: ${{ steps.surface.outputs.native }}
      rust: ${{ steps.surface.outputs.rust }}
      windows: ${{ steps.surface.outputs.windows }}
      macos: ${{ steps.surface.outputs.macos }}
      production: ${{ steps.surface.outputs.production }}
      container: ${{ steps.surface.outputs.container }}
      toolbelt: ${{ steps.surface.outputs.toolbelt }}
      android: ${{ steps.surface.outputs.android }}
      security: ${{ steps.surface.outputs.security }}
      full: ${{ steps.surface.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Checkout CI policy from the calling workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-tooling
          sparse-checkout: scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: surface
        env:
          CI_FULL: ${{ inputs.full || false }}
          CI_CALLED: ${{ inputs.source_sha != '' }}
          CI_QUALIFICATION: ${{ inputs.qualification || 'all' }}
        run: node .ci-tooling/scripts/ci-scope.mjs

  production-preflight:
    name: Production lock preflight
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No install/build: block consumers of an invalid production graph while
      # unrelated source and native-owner checks still report their results.
      - run: node scripts/build-cloud-runtime.mjs --check-lock

  portable-source:
    name: Portable source checks
    runs-on: ubuntu-latest
    needs: changes
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-source-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      # Documentation checks use only Node built-ins; prose-only changes do not
      # need the workspace/native dependency installation or postinstall hooks.
      - if: needs.changes.outputs.code == 'true'
        id: dependencies
        uses: ./.github/actions/desktop-downloads
        with:
          electron: 'false'
      - run: bun run test:docs
      - run: bun run docs:validate
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        name: Verify security repairs and applicable advisories
        env:
          LIVE_AUDIT: ${{ needs.changes.outputs.security }}
        run: |
          if [ "$LIVE_AUDIT" = true ]; then bun run audit:dependencies;
          else node scripts/audit-dependencies.mjs --local-only; fi
      - if: ${{ !cancelled() && needs.changes.outputs.security == 'true' && steps.dependencies.outcome == 'success' }}
        id: rust-audit-tool
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit@0.22.2
      - if: ${{ !cancelled() && steps.rust-audit-tool.outcome == 'success' }}
        name: Audit Rust kernel dependencies
        run: cargo audit --file kernel/Cargo.lock
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: prepare
        run: bun run build:type-dependencies
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun run type-check:prepared
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run lint
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run test:tooling
      # Package consumers do not require a native executable; collect their
      # results independently of the parallel native build and acceptance.
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun run test:packages
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        name: Test desktop driver protocols on a private D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi dbus
          dbus-run-session -- env VARIN_TEST_PRIVATE_BUS=1 /usr/bin/python3 -m unittest discover -s packages/computer-driver/linux -p 'test_*.py'
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun run --cwd packages/electron test:linux-desktop
      - if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.production != 'true' && steps.prepare.outcome == 'success' }}
        name: Build browser and desktop shell consumers
        run: |
          bun run build:frontend
          bun run --cwd packages/electron build
          bun run --cwd packages/mobile build:assets

  native-build:
    name: Build shared Linux kernel
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.production == 'true'
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-kernel-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/release
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - run: node scripts/build-products.mjs kernel --export artifacts/shared-kernel
      - uses: actions/upload-artifact@v7
        with:
          name: varin-ci-kernel-linux-x64
          path: artifacts/shared-kernel/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error

  linux-native:
    name: Linux native verification
    runs-on: ubuntu-latest
    needs: [changes, native-build]
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' && needs.native-build.result == 'success' }}
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-native-{0}', github.run_id) }}
      queue: max
    env:
      VARIN_KERNEL_ARTIFACT: ${{ github.workspace }}/.build-input/kernel
      VARIN_TEST_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
      VARIN_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@v8
        with:
          name: varin-ci-kernel-linux-x64
          path: .build-input/kernel
      - id: native-restore
        run: node scripts/build-products.mjs kernel
      - id: dependencies
        run: bun install --frozen-lockfile
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: prepare
        run: bun run build:type-dependencies
      - if: ${{ !cancelled() && steps.native-restore.outcome == 'success' && steps.prepare.outcome == 'success' }}
        name: Prepare FUSE for native workspace acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      - if: ${{ !cancelled() && steps.native-restore.outcome == 'success' && steps.prepare.outcome == 'success' }}
        name: Verify native kernel authority
        run: node scripts/test-kernel-authority.mjs

  rust-workspace:
    name: Rust workspace verification
    runs-on: ubuntu-latest
    needs: [changes, native-build]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.native-build.result == 'success' }}
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-rust-{0}', github.run_id) }}
      queue: max
    env:
      VARIN_KERNEL_ARTIFACT: ${{ github.workspace }}/.build-input/kernel
      VARIN_TEST_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
      VARIN_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache/restore@v6
        id: rust-cache
        if: needs.changes.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/debug
          key: rust-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - uses: actions/download-artifact@v8
        with:
          name: varin-ci-kernel-linux-x64
          path: .build-input/kernel
      - id: native-restore
        run: node scripts/build-products.mjs kernel
      - id: dependencies
        run: bun install --frozen-lockfile
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: prepare
        run: bun run build:type-dependencies
      - if: ${{ !cancelled() && steps.native-restore.outcome == 'success' && steps.prepare.outcome == 'success' }}
        name: Prepare FUSE for Rust workspace tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      # Rust tests use the same verified release kernel and built Host helpers,
      # but do not wait for the independent Host/native acceptance job.
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && steps.native-restore.outcome == 'success' && steps.prepare.outcome == 'success' }}
        id: rust-build
        name: Build Rust workspace tests
        run: bun run test:rust --no-run
      # Keep cold compilation outside the execution budget. Successful workspace
      # execution takes about 90 seconds; ten minutes allows runner variance but
      # fails visibly if a test retains a worker or waits indefinitely.
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && steps.rust-build.outcome == 'success' }}
        name: Compile native FUSE workspace adapter
        working-directory: kernel
        run: cargo check -p varin-kernel --all-targets --features workspace-mount --locked
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && steps.rust-build.outcome == 'success' }}
        name: Compile public libfuse3 mount transport
        working-directory: kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev
          cargo check -p varin-kernel --lib --features workspace-mount,fuser/libfuse3 --locked
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && steps.rust-build.outcome == 'success' }}
        name: Test Rust workspace
        timeout-minutes: 10
        env:
          VARIN_TEST_KERNEL_EXECUTABLE: ${{ github.workspace }}/artifacts/build/kernel-linux-x64/varin-kernel
          RUST_BACKTRACE: 1
        # Report failures from every test binary in one round; Cargo still fails
        # the step if any binary fails, and the execution timeout bounds hangs.
        run: bun run test:rust --no-fail-fast

      - if: ${{ !cancelled() && steps.rust-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        name: Preserve compiled Rust test inputs
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  windows-runtime:
    name: Windows runtime
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-windows-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - id: dependencies
        uses: ./.github/actions/desktop-downloads
      - id: prepare
        run: bun run build:type-dependencies
      # OS-sensitive package checks do not depend on native compilation.
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun run test:packages:platform
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run --cwd packages/electron test:packaging-tools
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Build and verify native Windows Computer helper without desktop input
        shell: pwsh
        run: |
          node --test packages/computer-driver/windows/test_build_helper.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/computer-driver/windows/build-helper.mjs --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/computer-driver/windows/smoke-helper.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Linux owns the complete platform-independent Host behavior matrix.
      # Qualification retains the full second-OS sweep; normal PRs exercise
      # actual file/lock/CAS/credential/process owners, not a copied core suite.
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Verify Windows Host owners
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL" = true ]; then bun run --cwd packages/web test;
          else bun run --cwd packages/web test:platform; fi

  windows-native-build:
    name: Build shared Windows kernel
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true' && needs.changes.outputs.native == 'true'
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-windows-build-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/release
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - run: node scripts/build-products.mjs kernel --export artifacts/shared-kernel
      - uses: actions/upload-artifact@v7
        with:
          name: varin-ci-kernel-windows-x64
          path: artifacts/shared-kernel/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error

  windows-native:
    name: Windows native resources and teardown
    runs-on: windows-latest
    needs: [changes, windows-native-build]
    if: ${{ !cancelled() && needs.changes.outputs.windows == 'true' && needs.changes.outputs.native == 'true' && needs.windows-native-build.result == 'success' }}
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-windows-native-{0}', github.run_id) }}
      queue: max
    env:
      VARIN_KERNEL_ARTIFACT: ${{ github.workspace }}/.build-input/kernel
      VARIN_TEST_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-win32-x64/varin-kernel.exe
      VARIN_KERNEL_PATH: ${{ github.workspace }}/artifacts/build/kernel-win32-x64/varin-kernel.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/desktop-downloads
        with:
          tools: 'false'
      - run: bun run build:type-dependencies
      - uses: actions/download-artifact@v8
        with:
          name: varin-ci-kernel-windows-x64
          path: .build-input/kernel
      - run: node scripts/build-products.mjs kernel
      - uses: ./.github/actions/workspace-component
      - if: ${{ !cancelled() && success() }}
        name: Verify Windows native resources and teardown
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL" = true ]; then node scripts/test-kernel-authority.mjs;
          else node scripts/test-kernel-authority.mjs --platform; fi

  windows-workspace:
    name: Windows workspace storage and runtime
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true' && needs.changes.outputs.rust == 'true'
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-windows-workspace-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v6
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/debug
          key: rust-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml') }}
          restore-keys: rust-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - uses: ./.github/actions/workspace-component
      - name: Compile Windows workspace tests
        id: compile
        shell: cmd
        working-directory: kernel
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "LIBCLANG_PATH=%ProgramFiles%\LLVM\bin"
          cargo test -p varin-kernel --lib workspace --features workspace-mount --locked --no-run
      - if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        name: Preserve compiled workspace test inputs
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        name: Verify native workspace storage and runtime on Windows
        shell: cmd
        working-directory: kernel
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "LIBCLANG_PATH=%ProgramFiles%\LLVM\bin"
          cargo test -p varin-kernel --lib workspace --features workspace-mount --locked
      - if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        name: Verify WinFsp mapped-file close and sibling lifetime
        shell: cmd
        working-directory: kernel
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "LIBCLANG_PATH=%ProgramFiles%\LLVM\bin"
          cargo test -p varin-kernel --lib workspace_mount::review::native_workspace_mounts_share_storage_and_keep_fork_independent --features workspace-mount --locked -- --exact --ignored --list | findstr /L /C:"workspace_mount::review::native_workspace_mounts_share_storage_and_keep_fork_independent: test"
          if errorlevel 1 exit /b 1
          cargo test -p varin-kernel --lib workspace_mount::review::native_workspace_mounts_share_storage_and_keep_fork_independent --features workspace-mount --locked -- --exact --ignored --nocapture

  macos-storage:
    name: macOS platform
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-macos-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache/restore@v6
        id: rust-cache
        if: needs.changes.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/debug
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - id: dependencies
        run: bun install --frozen-lockfile
      - id: prepare
        run: bun run build:type-dependencies
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Verify macOS file, credential and process owners
        run: |
          bun run test:packages:platform
          bun run --cwd packages/web test:platform
      - if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Compile the native macOS Computer helper
        run: node packages/computer-driver/macos/build-helper.mjs "$RUNNER_TEMP/varin-computer"
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        name: Compile and ad-hoc sign the bundled FSKit executor
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          node packages/workspace-driver/macos/build-helper.mjs "$RUNNER_TEMP/varin-workspace" "$(node -p process.arch)"
          node packages/workspace-driver/macos/build-helper.mjs "$RUNNER_TEMP/varin-workspace-intel" x64
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        name: Verify workspace tree publication on macOS
        working-directory: kernel
        run: cargo test -p varin-kernel --lib storage::versioned_workspaces_review --locked
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        name: Verify native executor bytes, cache boundaries and admitted-inode import
        working-directory: kernel
        run: |
          cargo test -p varin-kernel --lib workspace_mount:: --locked
      # Compile callback contracts without installing a filesystem component or
      # changing the runner's system-extension policy. Actual mount tests remain
      # explicit qualification on a machine with an already-enabled component.
      - if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        id: rust-compile
        name: Compile macOS workspace callbacks without system installation
        working-directory: kernel
        run: cargo check -p varin-kernel --all-targets --features workspace-mount --locked

      - if: ${{ !cancelled() && steps.rust-compile.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        name: Preserve compiled macOS Rust inputs
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [changes, native-build, production-preflight]
    if: ${{ !cancelled() && needs.changes.outputs.production == 'true' && needs.native-build.result == 'success' && needs.production-preflight.result == 'success' }}
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-build-{0}', github.run_id) }}
      queue: max
    env:
      VARIN_KERNEL_ARTIFACT: ${{ github.workspace }}/.build-input/kernel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@v8
        with:
          name: varin-ci-kernel-linux-x64
          path: .build-input/kernel
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Imports the built server artifact under plain Node: vitest's CJS
      # interop hides require/import mismatches that break `node server/index.js`.
      - name: Smoke built server artifact under Node
        run: node --test packages/web/application-host/lib/knowledge/store.smoke.test.ts
      - name: Verify Linux x64 VM guest bundle
        run: node scripts/build-vm-guest-bundle.mjs --skip-build
      # This stages and verifies the production lock/layout once, then exercises
      # the same archive through install, health checks and rollback.
      - name: Smoke atomic cloud deployment and rollback
        run: bash scripts/smoke-cloud-deploy.sh --archive packages/computer-driver/linux/guest-bundle-x64/runtime.tgz
      - run: bun run test:packages:dist

  container-check:
    name: Container contract
    needs: [changes, production-preflight]
    if: needs.changes.outputs.container == 'true' && needs.production-preflight.result == 'success'
    uses: ./.github/workflows/container-check.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      tooling_sha: ${{ github.sha }}
      toolbelt: ${{ needs.changes.outputs.toolbelt == 'true' }}
      multi_platform: ${{ needs.changes.outputs.full == 'true' }}
      benchmark: ${{ github.event_name == 'workflow_dispatch' && inputs.container_benchmark == true }}

  android-build:
    name: Android unsigned build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    concurrency:
      group: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'varin-dependabot-background' || format('varin-ci-android-{0}', github.run_id) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/android-setup
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run mobile:build:android:debug
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Keep one always-present check, including affected platform/product results.
  # A cancelled, failed, missing or unexpectedly skipped requirement is not green.
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    needs: [changes, production-preflight, portable-source, native-build, linux-native, rust-workspace, windows-runtime, windows-native-build, windows-native, windows-workspace, macos-storage, production-build, container-check, android-build]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every applicable check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs gate
