# DIAGNOSTIC-ONLY BRANCH: DO NOT MERGE. Product sources match repair PR249
# exactly; only this targeted workflow differs. Ordinary CI stays on PR249/main.
name: Windows PTY repair validation (DO NOT MERGE)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-terminal-stall:
    name: Verify Windows PTY descendant drain
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-${{ hashFiles('kernel/crates/**', 'kernel/vendor/**', 'kernel/Cargo.toml', 'scripts/build-kernel.mjs') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kernel/rust-toolchain.toml', 'kernel/Cargo.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:type-dependencies
      - run: bun run --cwd packages/web type-check:application-host:tests
      - name: Build the exact repair kernel
        run: node scripts/test-kernel-authority.mjs --build-only
      - name: Prepare WinFsp for native workspace acceptance
        shell: pwsh
        run: |
          node packages/electron/scripts/prepare-workspace-component.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $component = Get-Content packages/electron/resources/workspace-component.json -Raw | ConvertFrom-Json
          $installer = Join-Path $PWD "packages/electron/resources/workspace-component/$($component.file)"
          $installation = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) { throw "WinFsp installation did not finish without a restart: $($installation.ExitCode)" }
      - name: Preserve the exact compiled repair inputs
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Verify original process ownership and untraced Bash teardown
        timeout-minutes: 15
        # Match the original failing CI launcher. The terminal inherits this
        # process environment, including Git Bash/MSYS context.
        shell: bash
        run: |
          # No diagnostic tracing or alternate production path. The whole native
          # process file includes real descendants, tail output and setup failure.
          unset VARIN_TEST_TERMINAL_TRACE VARIN_PROCESS_TRACE
          node scripts/test-kernel-authority.mjs --vitest-file=application-host/lib/kernel/kernel-process.native.test.ts
          # Independent fresh fixtures sample the original intermittent race.
          # Any failure terminates this job; it can never become retry-to-green.
          for iteration in $(seq 1 12); do
            echo "Git Bash live-shell stop sample $iteration / 12"
            node scripts/test-kernel-authority.mjs --vitest-file=application-host/lib/terminal/shell-integration.live.native.test.ts
          done
