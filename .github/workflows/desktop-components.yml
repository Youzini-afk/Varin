name: Optional desktop components
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      matrix:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Optional inference ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VARIN_TARGET_ARCH: ${{ matrix.architecture }}
      VARIN_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      VARIN_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/varin-native/**/payload
            ~/.cache/varin-native/**/receipt.json
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/electron/scripts/prepare-*-runtime.mjs', 'scripts/local-embedding-runtime/bun.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/varin-components
          key: inference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-local-semantic-component.mjs', 'scripts/build-cache.mjs', 'scripts/local-embedding-runtime/**', 'scripts/local-embedding-worker.mjs', 'packages/web/scripts/copy-semantic-model.mjs', 'packages/web/application-host/lib/knowledge/semantic/runtime/bekko-embedding-v1-a8m/*.json', 'packages/web/application-host/lib/knowledge/semantic/local-component-manifest.ts', 'packages/electron/scripts/prepare-onnx-runtime.mjs') }}
      - run: bun install --frozen-lockfile
      - run: node scripts/build-local-semantic-component.mjs --output packages/electron/release-components
      - name: Record verified component provenance
        run: node scripts/release-artifacts.mjs record --directory packages/electron/release-components --kind component --platform '${{ matrix.nodePlatform }}' --arch '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v7
        with:
          name: component-${{ matrix.nodePlatform }}-${{ matrix.architecture }}
          path: packages/electron/release-components/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          overwrite: true
