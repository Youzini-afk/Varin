name: 功能建议 / Feature request
description: 提出面向用户的改动 · Propose a user-facing change
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        介绍你想完成的工作，以及当前卡在哪里。欢迎附上使用示例、草图或实现想法。

        Describe what you want to do and where the current workflow gets in the way.
        Examples, sketches, and implementation ideas are welcome.
  - type: textarea
    id: problem
    attributes:
      label: 问题 / Problem
      description: 现在缺什么，或什么很难做？· What is missing, or hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望结果 / Desired outcome
      description: 用户应该能做成什么？· What should a user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案 / Alternatives you considered
