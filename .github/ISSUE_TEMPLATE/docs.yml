name: 文档 / Documentation
description: 改进说明、示例、链接或翻译 · Improve instructions, examples, links, or translations
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: 页面 / Page
      description: >-
        README、指南、文档页的链接或路径，以及对应语言 ·
        A README, guide, or docs URL/path and its language
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 哪里不对 / What is wrong
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: 建议改法 / Suggested fix
