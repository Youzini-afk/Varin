name: 缺陷报告 / Bug report
description: 功能坏了，或行为和预期不符 · Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。复现示例、截图和日志都很有帮助，分享前请移除密钥与私人数据。

        Please search existing issues first. Examples, screenshots, and logs help us reproduce the
        problem. Remove credentials and private data before sharing them.
  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么 / What happened
      description: 你看到了什么？· What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么 / What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 产品端 / Surface
      options:
        - Web
        - 桌面端 / Desktop
        - 移动端 / Mobile
        - Docker / 远程 Host / Remote Host
        - 扩展 / Extension
        - 不确定 / Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交 / Version or commit
      placeholder: 例如 0.9.25 或 git SHA · e.g. 0.9.25 or a git SHA
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      placeholder: 操作系统、安装方式；模型或远程连接相关问题请补充服务名称 · OS, installation method, and relevant model or remote service
  - type: textarea
    id: evidence
    attributes:
      label: 截图与日志（可选） / Screenshots and logs (optional)
      description: 附上能说明问题的片段即可，请移除敏感信息 · Relevant excerpts are enough; remove sensitive information
