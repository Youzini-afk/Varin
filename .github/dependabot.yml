version: 2
# Check for releases every 24 hours (00:00 UTC), including weekends.
# Proposing an update does not approve it:
# keep major upgrades visible and review their migration notes before merging.
updates:
  - package-ecosystem: cargo
    directory: /kernel
    schedule:
      interval: cron
      cronjob: '0 0 * * *'
    cooldown:
      default-days: 0
    groups:
      tree-sitter-wasm:
        patterns:
          - tree-sitter
          - wasmtime*
          - cranelift*
      kernel-patches:
        patterns: ['*']
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 * * *'
    cooldown:
      default-days: 0
    groups:
      # The artifact actions must carry matching major versions, and the download action's v8 is the
      # counterpart to the newer non-zipped upload behavior. Proposing one side alone is half a
      # migration, so keep the pair in one pull request.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
      routine-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # This workspace installs with Bun and CI runs `bun install --frozen-lockfile`. The `npm`
  # ecosystem edits `package.json` without maintaining `bun.lock`, so every pull request it opened
  # failed at install before a single real check ran. The `bun` ecosystem understands the text-based
  # `bun.lock` and updates both.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 * * *'
    cooldown:
      default-days: 0
    open-pull-requests-limit: 10
    groups:
      # ESLint and its TypeScript plugins have to move together: a major on one is inconsistent with
      # the others, so separate pull requests cannot pass individually.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-plugin-*
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      electron-runtime:
        patterns:
          - electron
          - electron-context-menu
      # Pi publishes its packages in lockstep and Varin pins them to one exact version, so a
      # single-package bump is a half upgrade that cannot pass. Upgrading also means refreshing the
      # cloud runtime lockfile, so keep it one review.
      pi-runtime:
        patterns:
          - '@earendil-works/*'
      capacitor:
        patterns:
          - '@capacitor/*'
          - '@capacitor-mlkit/*'
          - '@aparajita/capacitor-*'
      # Keep routine upgrades in one review/build instead of one full CI run per package.
      # Major upgrades remain separate unless they belong to a coupled group above.
      routine-libraries:
        patterns: ['*']
        update-types: [minor, patch]
