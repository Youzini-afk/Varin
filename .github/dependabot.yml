version: 2
# Proposing an update does not approve it:
# keep major upgrades visible and review their migration notes before merging.
# GitHub has no unlimited sentinel: a large integer avoids a practical PR quota.
# Omitting open-pull-requests-limit restores 5; setting it to 0 disables version updates.
# Keep the default automatic rebase and independent security updates.
updates:
  - package-ecosystem: cargo
    directory: /kernel
    schedule:
      interval: cron
      # Include weekends; Dependabot's "daily" interval only runs on weekdays.
      cronjob: '0 1 * * *'
      timezone: UTC
    cooldown:
      default-days: 3
      semver-patch-days: 1
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 1000000
    groups:
      tree-sitter-wasm:
        patterns:
          - tree-sitter
          - wasmtime*
          - cranelift*
      sqlite-runtime:
        patterns:
          - rusqlite
          - libsqlite3-sys
      kernel-patches:
        patterns: ['*']
        exclude-patterns:
          - wasmparser
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: UTC
    cooldown:
      # GitHub Actions supports default-days, not SemVer-specific cooldowns.
      default-days: 3
    open-pull-requests-limit: 1000000
    groups:
      # Review the upload/download protocol together; compatible major numbers need not be equal.
      artifact-actions:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
      routine-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # This workspace installs with Bun and CI runs `bun install --frozen-lockfile`. The `npm`
  # ecosystem edits `package.json` without maintaining `bun.lock`, so every pull request it opened
  # failed at install before a single real check ran. The `bun` ecosystem understands the text-based
  # `bun.lock` and updates both.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 * * *'
      timezone: UTC
    cooldown:
      default-days: 3
      semver-patch-days: 1
      semver-minor-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 1000000
    groups:
      # First match wins. Coupled families include majors, but grouping does not prove compatibility.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-plugin-*
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      vite:
        patterns:
          - vite
          - '@vitejs/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
          - '@replit/codemirror-vim'
      pdf-runtime:
        patterns:
          - pdfjs-dist
          - '@napi-rs/canvas'
      electron-runtime:
        patterns:
          - electron
          - electron-context-menu
      capacitor:
        patterns:
          - '@capacitor/*'
          - '@capacitor-mlkit/*'
          - '@aparajita/capacitor-*'
      # Even a 0.x minor can change the persisted database format. Review its
      # upgrade path separately instead of hiding it among routine libraries.
      storage-runtime:
        patterns:
          - triviumdb
      # Bun groups do not support dependency-type: development; list pure tools explicitly.
      development-tools:
        patterns:
          - globals
          - tsx
          - concurrently
          - cross-env
          - nodemon
        update-types: [minor, patch]
      # Sensitive runtime, native and toolchain updates remain individual review units.
      # Exclusion from this group does not ignore updates. In particular, the legacy Trivium
      # alias is a manually pinned old-format reader, not another copy to move to the newest
      # storage line. Bun currently skips npm: aliases; these patterns do not manage that pin.
      # Major upgrades remain separate unless they belong to a coupled group above.
      routine-libraries:
        patterns: ['*']
        exclude-patterns:
          - '@anthropic-ai/claude-agent-sdk'
          - '@simplewebauthn/*'
          - '@types/node'
          - '@vscode/ripgrep'
          - '@xmldom/xmldom'
          - ghostty-web
          - google-auth-library
          - jose
          - linkedom
          - monaco-editor
          - node-addon-api
          - sharp
          - sherpa-onnx-node
          - tree-sitter-*
          - triviumdb*
          - typescript
          - undici
          - web-tree-sitter
        update-types: [minor, patch]
