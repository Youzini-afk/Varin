# Nginx HTTP-context snippet (inside http {}, NOT a complete nginx.conf).
# Replace domain, certificate paths and upstream with existing deployment values.
map $http_upgrade $varin_upgrade {
    default upgrade;
    ''      close;
}
map $uri $varin_page_path {
    default 1;
    ~^/(api|auth|health)(/|$) 0;
}
map $http_accept $varin_html {
    default 0;
    ~*text/html 1;
}
map "$request_method:$http_sec_fetch_mode:$http_sec_fetch_dest:$http_upgrade:$varin_page_path:$varin_html" $varin_navigation {
    default 0;
    "GET:navigate:document::1:1" 1;
    "HEAD:navigate:document::1:1" 1;
}
upstream varin_external {
    # Same-machine native frps; or substitute the actual guarded backend.
    server 127.0.0.1:7300;
}
server {
    listen 443 ssl;
    server_name varin.example.com;
    ssl_certificate /etc/varin-https/fullchain.pem;
    ssl_certificate_key /etc/varin-https/privkey.pem;

    # Request/error logs may expose pairing URLs, query credentials and headers.
    access_log off;
    error_log /dev/null crit;
    # Operator chooses an appropriate upload limit; 0 adds no proxy-side limit.
    client_max_body_size 0;
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $varin_upgrade;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # This is the internet-facing proxy: replace untrusted forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # Origin, Cookie, Authorization, body and query pass through unchanged.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_next_upstream off;
    proxy_intercept_errors off;

    location / {
        # A return-only if selects a named location without rewriting URI/method.
        error_page 418 = @varin_document;
        if ($varin_navigation) { return 418; }
        proxy_pass http://varin_external;
    }
    location @varin_document {
        proxy_pass http://varin_external;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_varin_offline.html;
    }
    location = /_varin_offline.html {
        internal;
        alias /srv/varin-offline/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
# Keep your existing HTTP->HTTPS and certificate-renewal configuration.
# Do not log the HTTP redirect URL: legacy URLs may include pairing secrets.
